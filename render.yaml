services:
  - type: web
    name: cookin
    runtime: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app.py"
    envVars:
      - key: DATA_DIR
        value: /var/data
    disk:
      name: cookin-data
      mountPath: /var/data
      sizeGB: 2
