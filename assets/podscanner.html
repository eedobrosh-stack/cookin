<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PodScanner | Pawed</title>
<link rel="icon" href="/favicon-32.png">
<style>
  :root { --red:#e3222b; --ink:#171717; --muted:#6c6c6c; --line:#e5e5e5; --soft:#f4f4f4; --green:#12803a; --bg:#fff; }
  @media (prefers-color-scheme: dark) { :root { --ink:#eee; --muted:#9a9a9a; --line:#333; --soft:#1e1e1e; --bg:#121212; --green:#4ac47a; } }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--ink); background:var(--bg); font-family:Arial,"Noto Sans Hebrew",sans-serif; font-size:14px; }
  a { color:inherit; }
  .topline { height:5px; background:var(--red); }
  header, main { max-width:1500px; margin:auto; padding:0 20px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding-top:14px; padding-bottom:10px; flex-wrap:wrap; }
  h1 { margin:0; font-size:26px; } h1 span { color:var(--red); }
  .sub { color:var(--muted); font-size:13px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0; }
  button, select, input { font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 9px; }
  button { cursor:pointer; } button.primary { background:var(--red); border-color:var(--red); color:#fff; font-weight:700; }
  button:disabled { opacity:.5; cursor:default; }
  details { border:1px solid var(--line); border-radius:8px; padding:8px 12px; margin:8px 0; background:var(--soft); }
  summary { cursor:pointer; font-weight:700; }
  .grid { display:flex; gap:14px; flex-wrap:wrap; margin-top:8px; align-items:flex-end; }
  .grid label { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--muted); }
  .grid input[type=number] { width:90px; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; max-width:760px; }
  .chips label { flex-direction:row; align-items:center; gap:3px; border:1px solid var(--line); border-radius:12px; padding:2px 8px; background:var(--bg); color:var(--ink); }
  #prog { height:6px; background:var(--soft); border-radius:3px; overflow:hidden; margin:6px 0; } #prog i { display:block; height:100%; width:0; background:var(--red); transition:width .4s; }
  .tablewrap { overflow:auto; max-height:calc(100vh - 250px); border:1px solid var(--line); border-radius:8px; }
  table { border-collapse:collapse; width:100%; min-width:1250px; }
  th, td { padding:6px 9px; border-bottom:1px solid var(--line); text-align:right; vertical-align:top; }
  thead th { position:sticky; top:0; background:var(--soft); z-index:2; white-space:nowrap; }
  thead tr.filters th { top:34px; padding:4px 6px; font-weight:400; }
  thead tr.filters input, thead tr.filters select { width:100%; min-width:60px; padding:3px 5px; font-size:12px; }
  th.s { cursor:pointer; user-select:none; } th.s.on::after { content:" ▾"; } th.s.on.asc::after { content:" ▴"; }
  tr:hover td { background:var(--soft); }
  td.num { text-align:left; font-variant-numeric:tabular-nums; direction:ltr; }
  .pill { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; font-weight:700; }
  .in { background:rgba(18,128,58,.15); color:var(--green); } .out { background:rgba(227,34,43,.12); color:var(--red); }
  .why { color:var(--muted); font-size:11px; } .mut { color:var(--muted); }
  .vb button { padding:1px 7px; font-size:12px; } .vb button.on { background:var(--ink); color:var(--bg); }
  .name { display:flex; gap:8px; align-items:center; } .name img { width:34px; height:34px; border-radius:6px; flex:none; }
  .links a { margin-inline-end:8px; color:var(--red); text-decoration:none; font-weight:700; }
  .hostg { font-style:italic; color:var(--muted); }
  .count { font-weight:700; }
</style>
</head>
<body>
<div class="topline"></div>
<header>
  <div><h1>Pod<span>Scanner</span></h1><div class="sub">סורק פודקאסטים עולמי · רק למנהלים · <a href="/">חזרה ל-Pawed</a></div></div>
  <div class="bar"><span class="count" id="count"></span><button id="promote" class="primary" disabled>הוסף ל-Pawed</button><button id="csv">ייצוא CSV</button></div>
</header>
<main>
  <details id="scanbox">
    <summary>סריקה והגדרות כללי הסינון</summary>
    <div class="grid">
      <label>מדינות<div class="chips" id="countries"></div></label>
      <label>עומק (מקומות בכל קטגוריה)<input type="number" id="limit" value="100" min="10" max="200"></label>
      <label>סיווג ב-LunaRoute (מקס׳ פודים בריצה)<input type="number" id="ccap" value="600" min="0" max="3000"></label>
      <label style="flex-direction:row;align-items:center"><input type="checkbox" id="skipcharts"> רענון בלבד (בלי צ׳ארטים חדשים)</label>
      <button class="primary" id="scan">הפעל סריקה</button>
      <label>דירוג התאמה (מקס׳ פודים)<input type="number" id="jcap" value="150" min="10" max="1000"></label><button id="judge">דרג התאמה ל-Pawed (LunaRoute)</button>
    </div>
    <div id="prog"><i></i></div><div class="sub" id="pst"></div>
    <hr style="border:0;border-top:1px solid var(--line);margin:10px 0">
    <div class="grid">
      <label>פרק אחרון עד (ימים)<input type="number" id="s_days"></label>
      <label>מינימום פרקים<input type="number" id="s_eps"></label>
      <label>מרווח מקסימלי בין פרקים (ימים)<input type="number" id="s_gap"></label>
      <label>שפות (קודים, מופרדים בפסיק)<input id="s_lang" style="width:130px"></label>
      <label>נושאים מותרים<input id="s_topics" style="width:280px"></label>
      <label>ז׳אנרים חסומים<input id="s_block" style="width:280px"></label>
      <button id="save">שמור וסנן מחדש</button>
    </div>
  </details>
  <div class="tablewrap">
  <table>
    <thead>
      <tr id="heads"></tr>
      <tr class="filters" id="filters"></tr>
    </thead>
    <tbody id="body"></tbody>
  </table>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
let SEL = new Set(), DATA = null, sortKey = 'score', sortAsc = false, F = {}, shown = [];
const COLS = [
  ['sel',''], ['name','שם'], ['hosts','מגישים'], ['geo','גיאוגרפיה'], ['language','שפה'], ['topic','נושא'], ['episodes','פרקים'],
  ['cadence','קצב'], ['score','ציון'], ['fit','התאמה'], ['last_ep','פרק אחרון'], ['days_since','ימים מאז'], ['link','קישור'], ['verdict','החלטה']];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const verdict = p => p.manual || p.auto;

async function api(path, body) {
  const r = await fetch(path, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {});
  return r.json();
}
function opts(vals, all='הכל') { return '<option value="">'+all+'</option>' + vals.map(v => '<option>'+esc(v)+'</option>').join(''); }
function buildHead() {
  $('heads').innerHTML = COLS.map(([k,l]) => '<th class="'+(['link','sel'].includes(k)?'':'s')+(sortKey===k?' on'+(sortAsc?' asc':''):'')+'" data-k="'+k+'">'+l+'</th>').join('');
  document.querySelectorAll('th.s').forEach(th => th.onclick = () => { const k = th.dataset.k; if (sortKey===k) sortAsc = !sortAsc; else { sortKey=k; sortAsc=true; } buildHead(); render(); });
  const uniq = f => [...new Set(DATA.pods.flatMap(f))].filter(Boolean).sort();
  const t = k => '<th><input data-f="'+k+'" placeholder="סנן" value="'+esc(F[k]||'')+'"></th>';
  const sel = (k, vals) => '<th><select data-f="'+k+'">'+opts(vals)+'</select></th>';
  const rng = k => '<th><input data-f="'+k+'" placeholder="מ-..עד" value="'+esc(F[k]||'')+'" title="למשל 50-200 או &gt;100 או &lt;30"></th>';
  $('filters').innerHTML = '<th><input type="checkbox" id="selall" title="בחר את כל המוצגים (עד 25)"></th>' + t('name') + t('hosts') + sel('geo', uniq(p => p.geo)) + sel('language', uniq(p => [p.language])) +
    sel('topic', uniq(p => [p.topic])) + rng('episodes') + sel('cadence', uniq(p => [p.cadence.replace(' (irregular)','')])) + rng('score') + rng('fit') + t('last_ep') + rng('days_since') +
    '<th></th><th><select data-f="verdict"><option value="">הכל</option><option value="in">נכנס</option><option value="out">נפסל</option><option value="manual">שיפוט ידני</option></select></th>';
  document.querySelectorAll('#filters [data-f]').forEach(el => {
    const k = el.dataset.f; if (F[k] != null && el.tagName === 'SELECT') el.value = F[k];
    el.oninput = el.onchange = () => { F[k] = el.value.trim(); render(); };
  });
}
function num(v, spec) {
  if (!spec) return true; if (v == null) return false;
  let m;
  if ((m = spec.match(/^>\s*(\d+)/))) return v > +m[1];
  if ((m = spec.match(/^<\s*(\d+)/))) return v < +m[1];
  if ((m = spec.match(/^(\d*)\s*-\s*(\d*)$/))) return (m[1]==='' || v >= +m[1]) && (m[2]==='' || v <= +m[2]);
  if (/^\d+$/.test(spec)) return v === +spec;
  return true;
}
function render() {
  const has = (s, q) => String(s||'').toLowerCase().includes(q.toLowerCase());
  shown = DATA.pods.filter(p =>
    (!F.name || has(p.name, F.name)) && (!F.hosts || has(p.hosts.join(' '), F.hosts)) &&
    (!F.geo || p.geo.includes(F.geo)) && (!F.language || p.language === F.language) && (!F.topic || p.topic === F.topic) &&
    num(p.episodes, F.episodes) && num(p.score, F.score) && num(p.fit, F.fit) && (!F.cadence || p.cadence.replace(' (irregular)','') === F.cadence) &&
    (!F.last_ep || has(p.last_ep, F.last_ep)) && num(p.days_since, F.days_since) &&
    (!F.verdict || (F.verdict === 'manual' ? !!p.manual : verdict(p) === F.verdict)));
  const key = sortKey === 'verdict' ? (p => verdict(p)) : sortKey === 'geo' ? (p => p.geo[0]||'') : sortKey === 'hosts' ? (p => p.hosts[0]||'') : (p => p[sortKey]);
  shown.sort((a,b) => { let x = key(a), y = key(b); if (x == null || x === '') return 1; if (y == null || y === '') return -1;
    return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y), 'he')) * (sortAsc ? 1 : -1); });
  const nin = shown.filter(p => verdict(p) === 'in').length;
  $('count').textContent = shown.length.toLocaleString() + ' פודים מוצגים מתוך ' + DATA.pods.length.toLocaleString() + ' · ' + nin.toLocaleString() + ' נכנסים';
  $('body').innerHTML = shown.slice(0, 600).map(p => {
    const v = verdict(p);
    return '<tr><td><input type="checkbox" class="sel" data-id="'+p.id+'" '+(SEL.has(p.id)?'checked':'')+(p.promoted?' disabled':'')+'></td><td><div class="name">'+(p.image?'<img loading="lazy" src="'+esc(p.image)+'" alt="">':'')+'<b>'+esc(p.name)+'</b>'+(p.promoted?' <span class="pill in">ב-Pawed</span>':'')+'</div></td>' +
      '<td class="'+(p.hosts_guess?'hostg':'')+'" title="'+(p.hosts_guess?'לא אומת, מתוך שדה המפיק בפיד':'')+'">'+esc(p.hosts.join(', '))+'</td>' +
      '<td>'+esc(p.geo.slice(0,3).join(', '))+(p.geo.length>3?' +'+(p.geo.length-3):'')+'</td><td>'+esc(p.language)+'</td><td>'+esc(p.topic)+'</td>' +
      '<td class="num">'+esc(p.episodes ?? '')+'</td><td>'+esc(p.cadence)+'</td><td class="num">'+esc(p.last_ep)+'</td>' +
      '<td class="num">'+esc(p.days_since ?? '')+'</td>' +
      '<td class="links">'+(p.link?'<a target="_blank" rel="noopener" href="'+esc(p.link)+'">Apple</a>':'')+(p.site?'<a target="_blank" rel="noopener" href="'+esc(p.site)+'">אתר</a>':'')+(p.feed?'<a target="_blank" rel="noopener" href="'+esc(p.feed)+'">RSS</a>':'')+'</td>' +
      '<td><span class="pill '+v+'">'+(v==='in'?'נכנס':'נפסל')+'</span>'+(p.manual?' <span class="why">(ידני)</span>':'<div class="why">'+esc(p.why.join(' · '))+'</div>')+
      '<div class="vb" data-id="'+p.id+'"><button data-v="in" class="'+(p.manual==='in'?'on':'')+'">נכנס</button> <button data-v="out" class="'+(p.manual==='out'?'on':'')+'">נפסל</button> <button data-v="">אוטו׳</button></div></td></tr>';
  }).join('') + (shown.length > 600 ? '<tr><td colspan="14" class="mut">מוצגות 600 הראשונות, צמצמו עם הסינון</td></tr>' : '');
  document.querySelectorAll('.sel').forEach(c => c.onchange = () => { c.checked ? SEL.add(c.dataset.id) : SEL.delete(c.dataset.id); selUi(); });
  const sa = $('selall'); if (sa) sa.onchange = () => { shown.filter(p => !p.promoted).slice(0, 25).forEach(p => sa.checked ? SEL.add(p.id) : SEL.delete(p.id)); render(); };
  selUi();
  document.querySelectorAll('.vb button').forEach(b => b.onclick = async () => {
    const id = b.parentElement.dataset.id, v = b.dataset.v, p = DATA.pods.find(x => x.id === id);
    await api('/api/podscanner/verdict', {id, verdict: v}); p.manual = v || null; render();
  });
}
function selUi() { $('promote').disabled = !SEL.size; $('promote').textContent = 'הוסף ל-Pawed' + (SEL.size ? ' (' + SEL.size + ')' : ''); }
$('promote').onclick = async () => {
  const ids = [...SEL].slice(0, 25);
  if (!confirm('להוסיף ' + ids.length + ' פודקאסטים כמקורות ב-Pawed? כל אחד יפיק מאמר מהפרק האחרון שלו (30 הימים האחרונים).')) return;
  $('promote').disabled = true; $('promote').textContent = 'מוסיף...';
  const r = await api('/api/podscanner/promote', {ids});
  const bad = r.results.filter(x => !x.ok);
  r.results.filter(x => x.ok).forEach(x => { const p = DATA.pods.find(q => q.id === x.id); if (p) { p.promoted = 'now'; p.manual = 'in'; } SEL.delete(x.id); });
  render();
  alert((r.results.length - bad.length) + ' נוספו' + (bad.length ? '\nנכשלו: ' + bad.map(x => (DATA.pods.find(q => q.id === x.id)||{}).name + ' (' + x.error + ')').join('; ') : '') + '\nהם יופיעו בטבלת המקורות, והמאמרים יופיעו כשהפרקים יעובדו.');
};
function fillSettings() {
  const s = DATA.settings;
  $('s_days').value = s.max_days_since; $('s_eps').value = s.min_episodes; $('s_gap').value = s.max_gap_days;
  $('s_lang').value = s.languages.join(','); $('s_topics').value = s.topics.join(','); $('s_block').value = s.block_genres.join(',');
}
const list = v => v.split(',').map(x => x.trim()).filter(Boolean);
$('save').onclick = async () => {
  await api('/api/podscanner/settings', {max_days_since:+$('s_days').value, min_episodes:+$('s_eps').value, max_gap_days:+$('s_gap').value,
    languages:list($('s_lang').value), topics:list($('s_topics').value), block_genres:list($('s_block').value)});
  await load();
};
$('scan').onclick = async () => {
  const cs = [...document.querySelectorAll('#countries input:checked')].map(i => i.value);
  const r = await api('/api/podscanner/scan', {countries:cs, limit:+$('limit').value, classify_cap:+$('ccap').value, skip_charts:$('skipcharts').checked});
  if (!r.ok) alert(r.error); poll();
};
$('judge').onclick = async () => { const r = await api('/api/podscanner/judge', {cap:+$('jcap').value}); if (!r.ok) alert(r.error); poll(); };
let timer = null;
async function poll() {
  clearTimeout(timer);
  const s = (await api('/api/podscanner/status')).status;
  $('scan').disabled = $('judge').disabled = s.running;
  const stages = {charts:'צ׳ארטים', lookup:'פרטי פודים', enrich:'קריאת RSS', classify:'סיווג LunaRoute', judge:'דירוג התאמה', starting:'מתחיל', done:'הסתיים'};
  $('prog').firstElementChild.style.width = (s.total ? Math.round(100*s.done/s.total) : (s.running?5:0)) + '%';
  $('pst').textContent = s.running ? (stages[s.stage]||s.stage)+' '+s.done+'/'+s.total : (s.error ? 'שגיאה: '+s.error : (s.finished ? 'ריצה אחרונה הסתיימה '+s.finished+' · '+s.msg : ''));
  if (s.running) timer = setTimeout(poll, 3000); else if (s.finished) load(true);
}
async function load(keep) {
  DATA = await api('/api/podscanner/pods');
  if (!DATA.ok) { document.body.innerHTML = '<p style="padding:40px">אין הרשאה</p>'; return; }
  if (!keep || !$('countries').children.length) {
    $('countries').innerHTML = Object.entries(DATA.countries).map(([c,n]) => '<label><input type="checkbox" value="'+c+'" checked>'+esc(n)+'</label>').join('');
  }
  fillSettings(); buildHead(); render();
  if (!DATA.pods.length) $('scanbox').open = true;
}
$('csv').onclick = () => {
  const rows = [['name','hosts','geo','language','topic','episodes','cadence','last_episode','days_since','verdict','apple','feed']].concat(
    shown.map(p => [p.name, p.hosts.join('; '), p.geo.join('; '), p.language, p.topic, p.episodes, p.cadence, p.last_ep, p.days_since, verdict(p), p.link, p.feed]));
  const csv = '﻿' + rows.map(r => r.map(c => '"' + String(c ?? '').replace(/"/g, '""') + '"').join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'})); a.download = 'podscanner.csv'; a.click();
};
load().then(poll);
</script>
</body>
</html>
