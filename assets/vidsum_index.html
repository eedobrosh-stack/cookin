    .panel { background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px 14px 14px; margin:0 0 16px; }
    .panel h2 { margin:0 0 2px; font-size:17px; } .panel .note { color:#777; font-size:12.5px; margin:0 0 10px; }
    table.st { width:100%; border-collapse:collapse; font-size:13.5px; direction:ltr; text-align:left; }
    table.st th, table.st td { padding:6px 8px; border-top:1px solid var(--line); } table.st th { font-size:12px; color:#777; font-weight:600; text-align:right; border-top:0; }
    table.st td.n { text-align:right; font-variant-numeric:tabular-nums; } table.st tr.on td { background:#fff7e0; }
    .bar1 { display:inline-block; height:8px; background:#e3222b; border-radius:3px; vertical-align:middle; margin-inline-start:6px; }
    .pc { color:#888; font-size:12px; margin-inline-start:4px; }
    .daily { display:flex; align-items:flex-end; gap:2px; height:110px; direction:ltr; }
    .daily div { flex:1; display:flex; flex-direction:column-reverse; min-width:3px; } .daily i { display:block; } .daily .p { background:#e3222b; } .daily .v { background:#1556d6; }
    .legend { font-size:12.5px; color:#555; margin-top:6px; } .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-inline-end:4px; vertical-align:middle; }
    .tag { font-size:11px; border-radius:4px; padding:1px 6px; background:#eee; color:#555; } .tag.podcast { background:#fde8e8; color:#b9141c; } .tag.video { background:#e6eefc; color:#1556d6; }
    .scrollx { overflow:auto; max-height:520px; }
  </style>
</head>
<body>
  <div class="topline"></div>
  <div class="utility"><div class="utility-inner"><span id="today"></span><div class="utility-links"><a href="/vidsum/index" id="nv-ix">אינדקס</a><a class="admin-only" href="/vidsum/articles" id="nv-all">כל הסיכומים</a><a class="admin-only" href="/vidsum/logs" id="nv-log">יומן</a><a class="admin-only" href="/vidsum/stats">Stats</a><a class="admin-only" href="/vidsum/err">ERR</a></div></div></div>
  <header class="masthead">
    <a class="brand" href="/"><img class="brand-wordmark" src="/vidsum/pawed-wordmark.png" alt="Pawed - Respect Your Pods"></a>
    <div class="masthead-actions"><a href="/vidsum" id="nv-home" style="font-size:13px;color:#777">← חזרה לעמוד הראשי</a></div>
  </header>
  <main>
    <h1 class="page" id="ttl">אינדקס</h1>
    <p class="sub2" id="sub"></p>
    <div class="ixsearch"><input id="q" type="search" autocomplete="off" spellcheck="false"><div id="sug" class="sug" hidden></div></div>
    <div id="view"></div>
  </main>
  <footer><div class="footer-inner"><span>Pawed · פורטל חדשות המבוסס על סיכומי וידאו</span><span id="stamp"></span></div></footer>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ACC = {"he": "IL", "en": "US", "es": "ES", "fr": "FR", "de": "DE", "it": "IT", "pt": "BR", "nl": "NL", "sv": "SE", "no": "NO", "pl": "PL", "ru": "RU", "tr": "TR", "ja": "JP", "ko": "KR", "ar": "SA", "da": "DK", "fi": "FI", "cs": "CZ", "sk": "SK", "uk": "UA", "el": "GR", "hu": "HU", "ro": "RO", "bg": "BG", "hr": "HR", "sr": "RS", "sl": "SI", "lt": "LT", "lv": "LV", "et": "EE", "hi": "IN", "zh": "CN", "id": "ID", "ms": "MY", "th": "TH", "vi": "VN", "fa": "IR", "ur": "PK", "bn": "BD", "ta": "IN", "te": "IN", "mr": "IN", "af": "ZA", "ga": "IE", "is": "IS", "mt": "MT", "sq": "AL", "mk": "MK", "be": "BY", "az": "AZ", "ka": "GE", "hy": "AM", "kk": "KZ", "uz": "UZ", "mn": "MN", "my": "MM", "sw": "KE", "fil": "PH"};
const FLAG = cc => cc ? [...cc].map(ch=>String.fromCodePoint(0x1F1E6+ch.charCodeAt(0)-65)).join('') : '';
const STR = {
  he:{title:'אינדקס', sub:'כל האישים, החברות, מילות המפתח, הפודקאסטים והפרקים ש-Pawed מכסה, לפי סדר אלפביתי. לחצו על פריט כדי לראות את כל הכתבות הרלוונטיות.', ph:'חיפוש אישים, חברות, מילות מפתח, פודקאסטים ופרקים…', more:'הצג עוד', back:'‹ חזרה לאינדקס', arts:'כתבות', all:'הכל', none:'לא נמצאו תוצאות', loading:'טוען…', host:'מנחה', locale:'he-IL', showing:'מציג תוצאות עבור', asked:'חיפשת'},
  en:{title:'Index', sub:'Every person, company, keyword, podcast and episode Pawed covers, A to Z. Click one to see all the articles about it.', ph:'Search people, companies, keywords, podcasts and episodes…', more:'Show more', back:'‹ Back to the index', arts:'articles', all:'All', none:'No results', loading:'Loading…', host:'Host', locale:'en-GB', showing:'Showing results for', asked:'You searched'}
};
let LANG = 'he', S = STR.he, ENT = [], LETTER = '', SHOW = 300, SEL = -1, SUG = [];
const NIQ = /[֑-ׇ]/g, HSIM = {'ט':'ת','ק':'כ','ע':'א','ו':'','י':''};
const norm = s => (s||'').normalize('NFKC').toLowerCase().replace(NIQ,'').replace(/[׳״'’"\-_]/g,'').replace(/ph/g,'f').replace(/th/g,'t').replace(/ck/g,'k').replace(/[טקעוי]/g,c=>HSIM[c]);
const lev = (a,b) => { if(Math.abs(a.length-b.length)>2) return 9; const d=[...Array(b.length+1).keys()]; for(let i=1;i<=a.length;i++){ let p=d[0]; d[0]=i; for(let j=1;j<=b.length;j++){ const t=d[j]; d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1)); p=t; } } return d[b.length]; };
const letterOf = l => { const c = (l||'').replace(/^[^\p{L}\p{N}]+/u,'').charAt(0).toUpperCase(); return /\p{L}/u.test(c) ? c : '#'; };
function listView(){
  const rows = ENT.filter(e => !LETTER || letterOf(e.l) === LETTER);
  const letters = [...new Set(ENT.map(e => letterOf(e.l)))].sort((a,b)=> a==='#'?1 : b==='#'?-1 : a.localeCompare(b));
  $('view').innerHTML = '<div class="ixl"><button data-l="" class="'+(LETTER?'':'on')+'">'+S.all+'</button>'+letters.map(l=>'<button data-l="'+esc(l)+'" class="'+(l===LETTER?'on':'')+'">'+esc(l)+'</button>').join('')+'</div>'
    + '<ol class="ixlist">'+rows.slice(0,SHOW).map(e=>'<li><a href="#e='+encodeURIComponent(e.id)+'">'+esc(e.l)+'</a><span class="ixt">, '+esc(e.t.join(' · '))+' ('+e.n+')</span></li>').join('')+'</ol>'
    + (rows.length>SHOW ? '<button class="ixmore" id="more">'+S.more+' ('+(rows.length-SHOW)+')</button>' : '') + (rows.length ? '' : '<p>'+S.none+'</p>');
  $('view').querySelectorAll('.ixl button').forEach(b=>b.onclick=()=>{ LETTER=b.dataset.l; SHOW=300; listView(); });
  const m = $('more'); if(m) m.onclick = () => { SHOW += 600; listView(); };
}
const HLRE = ws => ws && ws.length ? new RegExp('('+ws.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi') : null;
const snipHtml = a => { if(!a.snip) return ''; const re = HLRE(a.hl); const t = esc(a.snip); return '<div class="ixs">'+(re ? t.replace(re,'<mark>$1</mark>') : t)+'</div>'; };
const artRow = (a, dt) => '<li><a class="ixa" href="'+((window.pawedBM&&pawedBM.url)?pawedBM.url(a):'/vidsum/article/'+encodeURIComponent(a.slug))+'">'+esc(a.title)+'</a>'+snipHtml(a)+'<div class="ixm">'
  +'<span class="ixhosts">'+(a.hosts||[]).map(h=>'<a href="#e='+encodeURIComponent(h.id)+'">'+esc(h.name)+'</a>').join(', ')+'</span>'
  +'<span class="ixflag">'+FLAG(a.afc||ACC[a.lang])+'</span><span class="ixdate">'+esc(dt(a.released))+'</span></div></li>';
async function entryView(param){
  $('view').innerHTML = '<p>'+S.loading+'</p>';
  const dt = r => r ? new Date(r.replace(' ','T')+'Z').toLocaleDateString(S.locale,{day:'numeric',month:'short',year:'numeric'}) : '';
  const get = off => fetch('/api/vidsum/index/entry?'+param+'&offset='+off).then(r=>r.json());
  const j = await get(0);
  if(!j.ok){ $('view').innerHTML = '<p>'+S.none+'</p>'; return; }
  let shown = j.articles.length;
  $('view').innerHTML = '<a class="ixback" href="#">'+S.back+'</a><h2 class="ixh">'+esc(j.entry.q ? j.entry.q : j.entry.l)+'<span class="ixt">'+(j.entry.t.length?', '+esc(j.entry.t.join(' · ')):'')+' ('+j.total+' '+S.arts+')</span></h2>'
    + (j.entry.corrected ? '<p class="ixfix">'+S.showing+' <b>'+esc(j.entry.l)+'</b></p>' : '')
    + '<ol class="ixres" id="ixres">'+j.articles.map(a=>artRow(a,dt)).join('')+'</ol><button class="ixmore" id="ixmore" hidden></button>';
  const more = $('ixmore');
  const sync = () => { more.hidden = shown >= j.total; more.textContent = S.more+' ('+(j.total-shown)+')'; };
  more.onclick = async () => { more.disabled = true; const k = await get(shown); $('ixres').insertAdjacentHTML('beforeend', k.articles.map(a=>artRow(a,dt)).join('')); shown += k.articles.length; more.disabled = false; sync(); };
  sync();
  window.scrollTo(0,0);
}
function route(){ const m = location.hash.match(/^#e=(.+)$/), s = location.hash.match(/^#q=(.+)$/); if(m) entryView('id='+encodeURIComponent(decodeURIComponent(m[1]))); else if(s){ $('q').value = decodeURIComponent(s[1]); entryView('q='+s[1]); } else listView(); }
function suggest(){
  const raw = $('q').value.trim(), q = norm(raw);
  if(!q){ $('sug').hidden = true; SUG = []; return; }
  const hit = e => { const l = norm(e.l), a = norm(e.a||''); return l.startsWith(q) ? 0 : a.startsWith(q) ? 1 : l.includes(q) ? 2 : a.includes(q) ? 3 : 9; };
  let list = ENT.map(e=>[hit(e),e]).filter(x=>x[0]<9);
  if(!list.length && q.length>=4){                      // nothing contains it: nearby spellings (Antropic -> Anthropic)
    const tol = q.length>=9 ? 2 : 1;
    list = ENT.map(e=>{ const ws = (e.l+' '+(e.a||'')).split(/[^\p{L}\p{N}]+/u).map(norm).filter(w=>w.length>=3); const d = Math.min(9,...ws.map(w=>lev(w,q))); return [d<=tol?4+d:9,e]; }).filter(x=>x[0]<9);
  }
  SUG = list.sort((x,y)=>x[0]-y[0] || y[1].n-x[1].n).slice(0,8).map(x=>x[1]); SEL = -1;
  $('sug').hidden = !SUG.length;
  $('sug').innerHTML = SUG.map((e,i)=>'<div class="sg" data-i="'+i+'"><b>'+esc(e.l)+'</b>'+(e.a?' <small>'+esc(e.a)+'</small>':'')+'<span class="ixt">'+esc(e.t.join(' · '))+' ('+e.n+')</span></div>').join('');
  $('sug').querySelectorAll('.sg').forEach(d=>d.onmousedown=ev=>{ ev.preventDefault(); pick(+d.dataset.i); });
}
function search(){ const t = $('q').value.trim(); if(!t) return; $('sug').hidden = true; location.hash = '#q='+encodeURIComponent(t); }
function pick(i){ const e = SUG[i]; if(!e) return; $('sug').hidden = true; $('q').value = e.l; location.hash = '#e='+encodeURIComponent(e.id); }
$('q').oninput = suggest;
$('q').onblur = () => setTimeout(()=>{ $('sug').hidden = true; }, 120);
$('q').onkeydown = ev => {
  if(ev.key==='ArrowDown'){ SEL = Math.min(SUG.length-1, SEL+1); }
  else if(ev.key==='ArrowUp'){ SEL = Math.max(0, SEL-1); }
  else if(ev.key==='Enter'){ if(SEL>=0) pick(SEL); else search(); return; }
  else if(ev.key==='Escape'){ $('sug').hidden = true; return; }
  else return;
  ev.preventDefault(); $('sug').querySelectorAll('.sg').forEach((d,i)=>d.classList.toggle('on', i===SEL));
};
window.addEventListener('hashchange', route);
async function init(){
  $('today').textContent = new Date().toLocaleDateString(document.documentElement.lang==='he'?'he-IL':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const j = await (await fetch('/api/vidsum/index')).json();
  LANG = j.lang === 'he' ? 'he' : 'en'; S = STR[LANG]; ENT = j.entries || [];
  document.documentElement.lang = LANG; document.documentElement.dir = LANG==='he' ? 'rtl' : 'ltr';
  if (LANG==='en') { $('nv-ix').textContent='Index'; $('nv-all').textContent='All summaries'; $('nv-log').textContent='Log'; $('nv-home').textContent='← Back to the home page'; }
  document.title = S.title + ' | Pawed'; $('ttl').textContent = S.title; $('sub').textContent = S.sub; $('q').placeholder = S.ph;
  route();
}
fetch('/api/vidsum/me').then(r=>r.json()).then(j=>{ if(j.admin) document.body.classList.add('admin'); }).catch(()=>{});
init();
</script>
