  .scrim {
    position: fixed;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(36, 28, 18, 0.18) 0%,
      rgba(36, 28, 18, 0.10) 38%,
      rgba(36, 28, 18, 0.58) 68%,
      rgba(28, 21, 12, 0.92) 100%
    );
    z-index: 1;
  }

  .stage {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    padding: 0 clamp(16px, 4vw, 48px) clamp(28px, 6vh, 64px);
  }

  .panel {
    width: min(960px, 100%);
    display: flex;
    flex-direction: column;
    gap: clamp(10px, 1.8vh, 18px);
  }

  .eyebrow {
    align-self: flex-start;
    font-size: clamp(12px, 1.6vw, 16px);
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--cream);
    background: rgba(28, 21, 12, 0.62);
    border: 1px solid rgba(246, 236, 216, 0.25);
    border-radius: 999px;
    padding: 8px 16px;
    text-shadow: 0 1px 6px rgba(20, 14, 8, 0.9);
  }
  .eyebrow strong {
    color: var(--heat-1);
    font-weight: 700;
  }

  .pct {
    font-size: clamp(56px, 11.5vw, 140px);
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 18px rgba(20, 14, 8, 0.85);
    margin: 0;
  }
  .pct .frac {
    color: var(--heat-1);
    font-size: 0.62em;
    font-weight: 700;
  }

  .barwrap { position: relative; }

  .bar {
    position: relative;
    height: clamp(26px, 4.5vh, 38px);
    border-radius: 999px;
    background: var(--track);
    border: 1px solid rgba(246, 236, 216, 0.35);
    box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.45);
    overflow: visible;
  }

  .fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0%;
    min-width: 8px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--heat-1), var(--heat-2) 55%, var(--heat-3));
    box-shadow: 0 0 22px rgba(224, 118, 46, 0.55);
  }

  .sun {
    position: absolute;
    top: 50%;
    left: 0%;
    transform: translate(-50%, -50%);
    font-size: clamp(34px, 6vh, 48px);
    line-height: 1;
    filter: drop-shadow(0 0 10px rgba(242, 177, 62, 0.9));
    user-select: none;
  }
  @media (prefers-reduced-motion: no-preference) {
    .sun { animation: throb 3.2s ease-in-out infinite; }
    @keyframes throb {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(242, 177, 62, 0.75)); }
      50%      { filter: drop-shadow(0 0 18px rgba(242, 177, 62, 1)); }
    }
  }

  .tick {
    position: absolute;
    top: 100%;
    width: 1px;
    height: 8px;
    margin-top: 3px;
    background: var(--bus-green);
    opacity: 0.85;
  }
  .tick span {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--bus-green);
    text-shadow: 0 1px 4px rgba(20, 14, 8, 0.9);
  }

  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 28px;
    margin-top: clamp(14px, 2.4vh, 22px);
    font-size: clamp(13px, 1.7vw, 16px);
    color: var(--cream-dim);
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 6px rgba(20, 14, 8, 0.85);
  }
  .stats b { color: var(--cream); font-weight: 700; }
</style>

<div class="bg" aria-hidden="true"></div>
<div class="scrim" aria-hidden="true"></div>

<div class="stage">
  <div class="panel">
    <div class="eyebrow"><strong>IL Summer <span id="yr"></span></strong></div>
    <div class="pct" id="pct" aria-hidden="true">—</div>
    <div class="barwrap">
      <div class="bar" id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Israeli summer progress">
        <div class="fill" id="fill"></div>
        <div class="sun" id="sun">☀️</div>
        <div id="ticks"></div>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // Israel runs IDT (UTC+3) continuously from late March to late October,
  // so both endpoints of the summer window are fixed UTC+3 instants.
  var YEAR = new Date().getUTCFullYear();
  var START = Date.UTC(YEAR, 4, 31, 21, 1, 0);   // Jun 1, 00:01 IDT
  var END   = Date.UTC(YEAR, 8, 30, 20, 59, 0);  // Sep 30, 23:59 IDT
  var SPAN = END - START;
  var DAY = 86400000;

  document.getElementById("yr").textContent = YEAR;

  // Month boundaries as ticks on the track (Jul/Aug/Sep 1, 00:00 IDT)
  var ticksEl = document.getElementById("ticks");
  [[6, "JUL"], [7, "AUG"], [8, "SEP"]].forEach(function (m) {
    var t = Date.UTC(YEAR, m[0], 0, 21, 0, 0); // 1st of month 00:00 IDT
    var el = document.createElement("div");
    el.className = "tick";
    el.style.left = ((t - START) / SPAN * 100).toFixed(3) + "%";
    el.innerHTML = "<span>" + m[1] + "</span>";
    ticksEl.appendChild(el);
  });

  var pctEl = document.getElementById("pct");
  var fillEl = document.getElementById("fill");
  var sunEl = document.getElementById("sun");
  var barEl = document.getElementById("bar");
  var statsEl = document.getElementById("stats");

  function fmtDays(ms) {
    return (ms / DAY).toFixed(1);
  }

  function render() {
    var now = Date.now();
    var raw = (now - START) / SPAN * 100;
    var pct = Math.min(100, Math.max(0, raw));
    var s = pct.toFixed(6);
    var dot = s.indexOf(".");
    pctEl.innerHTML = s.slice(0, dot) +
      '<span class="frac">' + s.slice(dot) + "%</span>";
    fillEl.style.width = pct + "%";
    sunEl.style.left = pct + "%";
    barEl.setAttribute("aria-valuenow", s);

    if (now < START) {
      statsEl.innerHTML = "Summer hasn’t started — <b>" +
        fmtDays(START - now) + "</b> days until Jun 1";
    } else if (now >= END) {
      statsEl.innerHTML = "<b>Summer is over.</b> See you next June ☀️";
    } else {
      statsEl.innerHTML =
        "Day <b>" + Math.floor((now - START) / DAY + 1) + "</b> of 122" +
        "<span><b>" + fmtDays(now - START) + "</b> days behind you</span>" +
        "<span><b>" + fmtDays(END - now) + "</b> days of summer left</span>";
    }
  }

  render();
  setInterval(render, 100);
})();
</script>
