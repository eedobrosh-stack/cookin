<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>וידסומ | חדשות מהסיכומים</title>
  <meta name="description" content="חדשות מתוך סיכומי וידאו ופודקאסטים">
  <style>
    :root { --red:#e3222b; --red-dark:#b9141c; --ink:#171717; --muted:#6c6c6c; --line:#e5e5e5; --paper:#fff; --soft:#f4f4f4; --yellow:#ffc400; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#fff; font-family:Arial, "Noto Sans Hebrew", sans-serif; }
    a { color:inherit; text-decoration:none; }
    .topline { height:5px; background:var(--red); }
    .utility { border-bottom:1px solid var(--line); color:#777; font-size:12px; }
    .utility-inner, .masthead, .nav, main, .footer-inner { max-width:1180px; margin:auto; padding-inline:22px; }
    .utility-inner { min-height:34px; display:flex; align-items:center; justify-content:space-between; gap:18px; }
    .utility-links { display:flex; gap:18px; }
    .live { color:var(--red); font-weight:700; }
    .masthead { height:102px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .brand { display:flex; align-items:baseline; gap:10px; }
    .brand-mark { color:var(--red); font-weight:900; font-size:50px; letter-spacing:-5px; line-height:1; }
    .brand-note { color:#777; font-size:13px; border-right:1px solid #ccc; padding-right:12px; }
    .masthead-actions { display:flex; align-items:center; gap:13px; }
    .date { color:#777; font-size:12px; }
    .round-btn { width:34px; height:34px; border:1px solid #d8d8d8; border-radius:50%; background:#fff; cursor:pointer; font-size:16px; }
    .nav-wrap { border-block:1px solid var(--line); box-shadow:0 2px 0 rgba(0,0,0,.02); }
    .nav { display:flex; min-height:48px; align-items:center; gap:0; overflow:auto; scrollbar-width:none; }
    .nav::-webkit-scrollbar { display:none; }
    .nav button { border:0; background:none; padding:15px 16px; font-size:15px; font-weight:700; white-space:nowrap; cursor:pointer; border-bottom:3px solid transparent; }
    .nav button:hover, .nav button.active { color:var(--red); border-bottom-color:var(--red); }
    main { padding-top:22px; padding-bottom:60px; }
    .breaking { display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--line); padding-bottom:13px; margin-bottom:20px; font-size:14px; }
    .breaking b { color:#fff; background:var(--red); padding:6px 10px; font-size:12px; white-space:nowrap; }
    .breaking span { color:#444; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .section-kicker { display:flex; align-items:center; gap:10px; margin:0 0 11px; font-size:14px; font-weight:800; color:var(--red); }
    .section-kicker::after { content:""; height:1px; background:var(--red); flex:1; opacity:.5; }
    .lead-grid { display:grid; grid-template-columns:1.45fr .85fr; gap:20px; border-bottom:1px solid var(--line); padding-bottom:25px; }
    .lead { min-height:325px; display:grid; grid-template-columns:1fr 1fr; background:#151515; color:#fff; overflow:hidden; }
    .lead-copy { padding:27px 28px; display:flex; flex-direction:column; justify-content:flex-end; }
    .eyebrow { color:var(--yellow); font-size:12px; font-weight:700; margin-bottom:12px; }
    .lead h1 { font-size:34px; line-height:1.08; margin:0 0 12px; letter-spacing:-1.2px; }
    .lead .subtitle { color:#ddd; font-size:16px; line-height:1.45; margin:0 0 17px; }
    .meta { color:#999; font-size:12px; display:flex; gap:8px; align-items:center; }
    .lead-art, .thumb { position:relative; overflow:hidden; background:linear-gradient(135deg,#8e121a 0%,#ed343c 48%,#f3a400 100%); }
    .lead-art::before, .thumb::before { content:""; position:absolute; inset:12% -12% -12% 14%; border:1px solid rgba(255,255,255,.44); transform:rotate(-18deg); box-shadow:0 0 0 18px rgba(0,0,0,.08), 0 0 0 37px rgba(255,255,255,.11); }
    .lead-art::after, .thumb::after { content:"וידסומ"; position:absolute; inset:auto 20px 18px auto; color:rgba(255,255,255,.74); font-size:21px; font-weight:900; letter-spacing:-2px; }
    .side-latest { display:flex; flex-direction:column; gap:0; }
    .side-item { padding:0 0 17px; margin-bottom:17px; border-bottom:1px solid var(--line); }
    .side-item:last-child { margin-bottom:0; }
    .side-item .tag { color:var(--red); font-size:12px; font-weight:700; }
    .side-item h2 { font-size:20px; line-height:1.16; margin:7px 0; }
    .side-item p { margin:0; color:#555; line-height:1.45; font-size:14px; }
    .section-head { display:flex; align-items:center; justify-content:space-between; margin:30px 0 12px; }
    .section-head h2 { margin:0; font-size:24px; }
    .section-head small { color:#888; }
    .feed-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:19px; }
    .card { border-top:4px solid var(--ink); background:#fff; display:flex; flex-direction:column; min-height:340px; }
    .card.hidden { display:none; }
    .thumb { height:128px; background:var(--tone, linear-gradient(135deg,#252525,#777)); }
    .card-body { padding:16px 16px 17px; display:flex; flex-direction:column; flex:1; }
    .card .tag { font-size:12px; font-weight:700; color:var(--red); }
    .card h3 { font-size:21px; line-height:1.17; margin:8px 0 7px; letter-spacing:-.35px; }
    .card p { margin:0; color:#555; line-height:1.45; font-size:14px; }
    .card .meta { margin-top:auto; padding-top:15px; color:#888; border-top:1px solid var(--line); }
    .topic-block { margin-top:36px; border-top:3px solid var(--ink); padding-top:15px; }
    .topic-block h2 { margin:0 0 15px; font-size:24px; }
    .topic-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:0 24px; }
    .topic-row { display:grid; grid-template-columns:110px 1fr; gap:16px; padding:15px 0; border-bottom:1px solid var(--line); }
    .topic-row .topic { font-weight:800; color:var(--red); font-size:13px; }
    .topic-row h3 { margin:0 0 5px; font-size:18px; line-height:1.18; }
    .topic-row p { margin:0; color:#666; font-size:13px; line-height:1.4; }
    footer { background:#222; color:#aaa; padding:28px 0; font-size:12px; }
    .footer-inner { display:flex; justify-content:space-between; gap:20px; }
    .prototype { color:#fff; background:#383838; padding:4px 8px; }
    @media (max-width:800px) {
      .masthead { height:82px; }
      .brand-mark { font-size:39px; }
      .brand-note, .date { display:none; }
      .lead-grid, .lead { grid-template-columns:1fr; }
      .lead-art { min-height:150px; order:-1; }
      .lead-copy { min-height:255px; }
      .lead h1 { font-size:29px; }
      .feed-grid { grid-template-columns:repeat(2,1fr); }
      .topic-grid { grid-template-columns:1fr; }
    }
    @media (max-width:520px) {
      .utility-links { display:none; }
      .utility-inner { justify-content:flex-start; }
      main, .utility-inner, .masthead, .nav, .footer-inner { padding-inline:14px; }
      .nav button { padding-inline:11px; font-size:13px; }
      .feed-grid { grid-template-columns:1fr; }
      .card { min-height:290px; }
      .section-head { align-items:flex-start; flex-direction:column; gap:4px; }
    }
  
    a.card h3, a.side-item h2, a.topic-link h3 { color:inherit; }
    .thumb.img { background-size:cover; background-position:center; }
    .thumb.img::before, .thumb.img::after, .lead-art.img::before, .lead-art.img::after { display:none; }
    .lead-art.img { background-size:cover; background-position:center; }
    .empty { color:#888; padding:40px 0; text-align:center; }
    .card:hover h3, .side-item:hover h2, .lead:hover h1, .topic-row:hover h3 { text-decoration:underline; }
</style>
</head>
<body>
  <div class="topline"></div>
  <div class="utility"><div class="utility-inner"><span id="today"></span><div class="utility-links"><span class="live">● מתעדכן אוטומטית</span><a href="/vidsum/articles">כל הסיכומים</a><a href="/vidsum">הוספת סרטון</a></div></div></div>
  <header class="masthead">
    <a class="brand" href="/vidsum/news"><span class="brand-mark">וידסומ</span><span class="brand-note">חדשות מתוך הסיכומים</span></a>
    <div class="masthead-actions"><span class="date" id="count"></span></div>
  </header>
  <div class="nav-wrap"><nav class="nav" id="nav" aria-label="נושאים"></nav></div>
  <main id="main"><p class="empty">טוען…</p></main>
  <footer><div class="footer-inner"><span>וידסומ · פורטל חדשות המבוסס על סיכומי וידאו</span><span>Summarized by vidsum skill (by Mr. Brosh)</span></div></footer>
<script>
const TONES = [
  'linear-gradient(135deg,#151515,#8c1d24 60%,#d7a100)','linear-gradient(135deg,#102844,#147b9b 55%,#65d2c7)',
  'linear-gradient(135deg,#193b2d,#3a9b60 55%,#d1bc55)','linear-gradient(135deg,#41235a,#b94278 55%,#f3a84c)',
  'linear-gradient(135deg,#154448,#2c9d8d 58%,#e8d36a)','linear-gradient(135deg,#263342,#64748b 55%,#d2a34c)'];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const href = a => '/vidsum/article/' + encodeURIComponent(a.slug);
const thumb = v => 'https://i.ytimg.com/vi/'+v+'/hqdefault.jpg';
const tone = a => TONES[[...a.vid].reduce((x,c)=>x+c.charCodeAt(0),0) % TONES.length];
function when(s){
  const d = new Date(s.replace(' ','T')+'Z'), now = new Date();   // server stores UTC
  const hm = d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
  if(d.toDateString()===now.toDateString()) return 'היום ב־'+hm;
  const y = new Date(now-864e5); if(d.toDateString()===y.toDateString()) return 'אתמול';
  return d.toLocaleDateString('he-IL');
}
const meta = a => [a.channel, a.minutes? 'סיכום '+a.minutes+' דק׳':'', when(a.created)].filter(Boolean).map(esc).join(' · ');
let DATA = null, FILTER = 'all';

function card(a){
  return '<a class="card" href="'+href(a)+'"><div class="thumb img" style="background-image:url('+thumb(a.vid)+'),'+tone(a)+'"></div>'
   +'<div class="card-body"><div class="tag">'+esc(a.topic)+'</div><h3>'+esc(a.title)+'</h3><p>'+esc(a.lead)+'</p><div class="meta">'+meta(a)+'</div></div></a>';
}
function render(){
  const all = DATA.items, items = FILTER==='all' ? all : all.filter(a=>a.topic===FILTER);
  const main = document.getElementById('main');
  if(!items.length){ main.innerHTML='<p class="empty">אין עדיין סיכומים במדור הזה — הם יופיעו כאן אוטומטית.</p>'; return; }
  let h='';
  const lead = items[0], side = items.slice(1,4), feed = items.slice(4);
  h+='<section class="lead-grid"><a class="lead" href="'+href(lead)+'"><div class="lead-copy"><div class="eyebrow">'+esc(lead.topic)+' · '+when(lead.created)+'</div>'
    +'<h1>'+esc(lead.title)+'</h1><p class="subtitle">'+esc(lead.lead)+'</p><div class="meta">'+meta(lead)+'</div></div>'
    +'<div class="lead-art img" style="background-image:url('+thumb(lead.vid)+'),'+tone(lead)+'"></div></a>'
    +'<div class="side-latest">'+side.map(a=>'<a class="side-item" href="'+href(a)+'"><div class="tag">'+esc(a.topic)+' · '+when(a.created)+'</div><h2>'+esc(a.title)+'</h2><p>'+esc(a.lead)+'</p></a>').join('')+'</div></section>';
  if(feed.length) h+='<div class="section-head"><h2>הכי חדש</h2><small>מסודר לפי מועד העלאת הסיכום</small></div><section class="feed-grid">'+feed.map(card).join('')+'</section>';
  if(FILTER==='all'){
    const rows = DATA.topics.map(t=>{ const a = all.find(x=>x.topic===t);
      return a ? '<a class="topic-row" href="'+href(a)+'"><div class="topic">'+esc(t)+'</div><div><h3>'+esc(a.title)+'</h3><p>'+esc(a.lead)+'</p></div></a>'
               : '<div class="topic-row"><div class="topic">'+esc(t)+'</div><div><h3>מדור בהכנה</h3><p>יוזן מסיכומי הווידאו הבאים.</p></div></div>'; });
    h+='<section class="topic-block"><h2>עוד לפי נושא</h2><div class="topic-grid">'+rows.join('')+'</div></section>';
  }
  main.innerHTML=h;
}
function nav(){
  const n=document.getElementById('nav');
  n.innerHTML=['all',...DATA.topics].map(t=>'<button data-f="'+esc(t)+'" class="'+(t===FILTER?'active':'')+'">'+(t==='all'?'ראשי':esc(t))+'</button>').join('');
  n.querySelectorAll('button').forEach(b=>b.onclick=()=>{FILTER=b.dataset.f; nav(); render(); history.replaceState(null,'', FILTER==='all'?location.pathname:'#'+encodeURIComponent(FILTER));});
}
document.getElementById('today').textContent = new Date().toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
fetch('/api/vidsum/news').then(r=>r.json()).then(j=>{
  DATA=j; const h=decodeURIComponent(location.hash.slice(1)); if(j.topics.includes(h)) FILTER=h;
  document.getElementById('count').textContent=j.items.length+' סיכומים';
  nav(); render();
}).catch(()=>{document.getElementById('main').innerHTML='<p class="empty">שגיאה בטעינה</p>';});
</script>
</body>
</html>
