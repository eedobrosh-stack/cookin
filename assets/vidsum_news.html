<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="theme-color" content="#e3222b">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pawed | Respect Your Pods</title>
  <meta name="description" content="חדשות מתוך סיכומי וידאו ופודקאסטים">
  <style>
    :root { --red:#e3222b; --red-dark:#b9141c; --ink:#171717; --muted:#6c6c6c; --line:#e5e5e5; --paper:#fff; --soft:#f4f4f4; --yellow:#ffc400; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#fff; font-family:Arial, "Noto Sans Hebrew", sans-serif; }
    a { color:inherit; text-decoration:none; }
    .topline { height:5px; background:var(--red); }
    .utility { border-bottom:1px solid var(--line); color:#777; font-size:12px; }
    .utility-inner, .masthead, .nav, main, .footer-inner { max-width:1180px; margin:auto; padding-inline:22px; }
    .utility-inner { min-height:34px; display:flex; align-items:center; justify-content:space-between; gap:18px; }
    .utility-links { display:flex; gap:18px; }
    .live { color:var(--red); font-weight:700; }
    .masthead { height:102px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .brand { display:flex; align-items:baseline; gap:10px; }
    .brand-mark { color:var(--red); font-weight:900; font-size:50px; letter-spacing:-5px; line-height:1; }
    .brand-note { color:#777; font-size:13px; border-right:1px solid #ccc; padding-right:12px; }
    .masthead-actions { display:flex; align-items:center; gap:13px; }
    .date { color:#777; font-size:12px; text-align:center; line-height:1.35; }
    .round-btn { width:34px; height:34px; border:1px solid #d8d8d8; border-radius:50%; background:#fff; cursor:pointer; font-size:16px; }
    .nav-wrap { border-block:1px solid var(--line); box-shadow:0 2px 0 rgba(0,0,0,.02); }
    .nav { display:flex; min-height:48px; align-items:center; gap:0; overflow:auto; scrollbar-width:none; }
    .nav::-webkit-scrollbar { display:none; }
    .nav button { border:0; background:none; padding:15px 16px; font-size:15px; font-weight:700; white-space:nowrap; cursor:pointer; border-bottom:3px solid transparent; }
    .nav button:hover, .nav button.active { color:var(--red); border-bottom-color:var(--red); }
    main { padding-top:22px; padding-bottom:60px; }
    .breaking { display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--line); padding-bottom:13px; margin-bottom:20px; font-size:14px; }
    .breaking b { color:#fff; background:var(--red); padding:6px 10px; font-size:12px; white-space:nowrap; }
    .breaking span { color:#444; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .section-kicker::after { content:""; height:1px; background:var(--red); flex:1; opacity:.5; }
    .lead-grid { display:grid; grid-template-columns:1.45fr .85fr; gap:20px; border-bottom:1px solid var(--line); padding-bottom:25px; }
    .lead { min-height:325px; display:grid; grid-template-columns:1fr 1fr; background:#151515; color:#fff; overflow:hidden; }
    .lead-copy { padding:27px 28px; display:flex; flex-direction:column; justify-content:flex-end; }
    .eyebrow { color:var(--yellow); font-size:12px; font-weight:700; margin-bottom:12px; }
    .lead h1 { font-size:34px; line-height:1.08; margin:0 0 12px; letter-spacing:-1.2px; }
    .lead .subtitle { color:#ddd; font-size:16px; line-height:1.45; margin:0 0 17px; }
    .meta { color:#999; font-size:12px; display:flex; gap:8px; align-items:center; }
    .lead-art, .thumb { position:relative; overflow:hidden; background:linear-gradient(135deg,#8e121a 0%,#ed343c 48%,#f3a400 100%); }
    .lead-art::before, .thumb::before { content:""; position:absolute; inset:12% -12% -12% 14%; border:1px solid rgba(255,255,255,.44); transform:rotate(-18deg); box-shadow:0 0 0 18px rgba(0,0,0,.08), 0 0 0 37px rgba(255,255,255,.11); }
    .lead-art::after, .thumb::after { content:"Pawed"; position:absolute; inset:auto 20px 18px auto; color:rgba(255,255,255,.74); font-size:21px; font-weight:900; letter-spacing:-2px; }
    .side-latest { display:flex; flex-direction:column; gap:0; }
    .side-item { padding:0 0 17px; margin-bottom:17px; border-bottom:1px solid var(--line); }
    .side-item:last-child { margin-bottom:0; }
    .side-item .tag { color:var(--red); font-size:12px; font-weight:700; }
    .side-item h2 { font-size:20px; line-height:1.16; margin:7px 0; }
    .side-item p { margin:0; color:#555; line-height:1.45; font-size:14px; }
    .section-head { display:flex; align-items:center; justify-content:space-between; margin:30px 0 12px; }
    .section-head h2 { margin:0; font-size:24px; }
    .section-head small { color:#888; }
    .feed-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:19px; }
    .card { border-top:4px solid var(--ink); background:#fff; display:flex; flex-direction:column; min-height:340px; }
    .card.hidden { display:none; }
    .thumb { height:128px; background:var(--tone, linear-gradient(135deg,#252525,#777)); }
    .card-body { padding:16px 16px 17px; display:flex; flex-direction:column; flex:1; }
    .card .tag { font-size:12px; font-weight:700; color:var(--red); }
    .card h3 { font-size:21px; line-height:1.17; margin:8px 0 7px; letter-spacing:-.35px; }
    .card p { margin:0; color:#555; line-height:1.45; font-size:14px; }
    .card .meta { margin-top:auto; padding-top:15px; color:#888; border-top:1px solid var(--line); }
    .topic-block { margin-top:36px; border-top:3px solid var(--ink); padding-top:15px; }
    .topic-block h2 { margin:0 0 15px; font-size:24px; }
    .topic-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:0 24px; }
    .topic-row { display:grid; grid-template-columns:110px 1fr; gap:16px; padding:15px 0; border-bottom:1px solid var(--line); }
    .topic-row .topic { font-weight:800; color:var(--red); font-size:13px; }
    .topic-row h3 { margin:0 0 5px; font-size:18px; line-height:1.18; }
    .topic-row p { margin:0; color:#666; font-size:13px; line-height:1.4; }
    footer { background:#222; color:#aaa; padding:28px 0; font-size:12px; }
    .footer-inner { display:flex; justify-content:space-between; gap:20px; }
    .prototype { color:#fff; background:#383838; padding:4px 8px; }
    @media (max-width:800px) {
      .masthead { height:82px; }
      .brand-mark { font-size:39px; }
      .brand-note, .date { display:none; }
      .lead-grid, .lead { grid-template-columns:1fr; }
      .lead-art { min-height:150px; order:-1; }

      .lead h1 { font-size:29px; }
      .feed-grid { grid-template-columns:repeat(2,1fr); }
      .topic-grid { grid-template-columns:1fr; }
    }
    @media (max-width:520px) {
      .utility-links { display:none; }
      .utility-inner { justify-content:flex-start; }
      main, .utility-inner, .masthead, .nav, .footer-inner { padding-inline:14px; }
      .nav button { padding-inline:11px; font-size:13px; }
      .feed-grid { grid-template-columns:1fr; }
      .card { min-height:290px; }
      .section-head { align-items:flex-start; flex-direction:column; gap:4px; }
    }
  
    a.side-item { display:block; }
    a.card h3, a.side-item h2, a.topic-link h3 { color:inherit; }
    .thumb.img { background-size:cover; background-position:center; background-repeat:no-repeat; }
    .thumb.img::before, .thumb.img::after, .lead-art.img::before, .lead-art.img::after { display:none; }
    .lead-art.img { background-size:cover; background-position:center; background-repeat:no-repeat; min-height:100%; }
    .empty { color:#888; padding:40px 0; text-align:center; }
    .card:hover h3, .side-item:hover h2, .lead:hover h1, .topic-row:hover h3 { text-decoration:underline; }

    .brand { align-items:center; gap:12px; }
    .brand-logo { height:58px; width:auto; display:block; }
    .brand-mark { color:#2a211b; font-size:46px; letter-spacing:-1.5px; font-family:"Arial Black",Arial,sans-serif; }
    .brand-note { border-right:1px solid #ccc; padding-right:12px; }
  
    /* promo images keep their full 16:9 frame (no cropping of the on-image text/faces) */
    .lead { display:flex !important; flex-direction:column; min-height:0 !important; grid-template-columns:none !important; }
    .lead-art, .lead-art.img { order:-1; width:100%; aspect-ratio:16/9; min-height:0 !important; height:auto; flex:none; background-size:cover; }
    .lead-copy { padding:22px 28px 26px !important; min-height:0 !important; justify-content:flex-start !important; }
    .lead h1 { font-size:30px; }
    .thumb, .thumb.img { height:auto !important; aspect-ratio:16/9; }
    .card { min-height:0 !important; }
  
    /* ===== mobile (phones): frozen category bar, compact header, list rows — same approach as cookin ===== */
    @media (max-width:640px) {
      body { -webkit-text-size-adjust:100%; }

      .utility-inner { padding-inline:12px; min-height:34px; justify-content:flex-start; }

      .utility-links::-webkit-scrollbar { display:none; }

      .brand { gap:8px; }

      .brand-note { display:none !important; }
      .masthead-actions a { font-size:12px !important; }

    }

    @media (max-width:640px) {
      /* category chips frozen at the top, one scrollable row */
      .nav-wrap { position:sticky; top:0; z-index:60; background:rgba(255,255,255,.97); backdrop-filter:blur(8px); box-shadow:0 1px 0 var(--line); }
      .nav { padding:7px 12px !important; min-height:0 !important; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
      .nav button { flex:0 0 auto; border:1px solid #d6d6d6 !important; border-radius:999px; padding:8px 15px !important; font-size:14px !important; background:#fff; }
      .nav button.active { background:var(--ink); color:#fff; border-color:var(--ink) !important; }
      .nav button:hover { color:inherit; }
      .nav button.active:hover { color:#fff; }
      /* lead: image on top, headline under it */
      .lead-grid { display:block !important; border-bottom:0; padding-bottom:6px; }
      .lead { margin:0 -12px; }
      .lead-copy { padding:14px 14px 16px !important; }
      .lead h1 { font-size:23px !important; line-height:1.15; letter-spacing:-.5px; margin-bottom:8px; }
      .lead .subtitle { font-size:15px; line-height:1.4; margin-bottom:10px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
      .eyebrow { margin-bottom:8px; }
      /* the three side stories + the feed: compact rows */
      .side-latest { margin-top:6px; }
      .side-item { padding:12px 0; margin:0; }
      .side-item h2 { font-size:18px; line-height:1.2; margin:4px 0 0; }
      .side-item p { display:none; }
      .section-head { margin:16px 0 8px; flex-direction:row !important; align-items:baseline; }
      .section-head h2 { font-size:21px; }
      .section-head small { display:none; }
      .feed-grid { display:flex !important; flex-direction:column; gap:0; }
      .card { flex-direction:row; border-top:0 !important; border-bottom:1px solid var(--line); padding:12px 0; gap:12px; align-items:flex-start; }
      .thumb, .thumb.img { width:126px; flex:0 0 126px; aspect-ratio:16/9; height:auto !important; border-radius:6px; }
      .card-body { padding:0 !important; min-width:0; }
      .card .tag { font-size:11px; }
      .card h3 { font-size:16px; line-height:1.22; margin:3px 0 4px; letter-spacing:0; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
      .card p { display:none; }
      .card .meta { border-top:0; padding-top:0; margin-top:2px; font-size:11px; }
      .topic-block { margin-top:18px; }
      .topic-block h2 { font-size:21px; }
      .topic-grid { grid-template-columns:1fr !important; }
      .topic-row { grid-template-columns:78px 1fr; gap:10px; padding:11px 0; }
      .topic-row p { display:none; }
    }
  
    /* homepage tint: very light purple */
    :root { --line:#e4dcf1; }
    body { background:#f7f3fc !important; }
    .nav-wrap, .utility, .masthead { background:transparent; }
    .card, .side-item, .topic-row { background:transparent; }
    @media (max-width:640px) { .nav-wrap { background:rgba(247,243,252,.97) !important; } .nav button { background:rgba(255,255,255,.65) !important; } .nav button.active { background:var(--ink) !important; } }
  
    /* ===== Pawed homepage v2: ynet-style varied tiles per topic ===== */
    main { max-width:1180px; }
    .hero2 { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.75fr); gap:22px; padding:6px 0 20px; align-items:start; }
    .hero2-t a { color:inherit; }
    .hero2-k { font-size:13px; color:#777; margin-bottom:8px; }
    .hero2 h1 { font-size:36px; line-height:1.08; letter-spacing:-1.2px; margin:0 0 12px; font-weight:900; }
    .hero2 p { font-size:16.5px; line-height:1.5; color:#333; margin:0 0 10px; }
    .hero2-t a:hover h1 { text-decoration:underline; }
    .hero2-m { font-size:12px; color:#999; margin-bottom:14px; }
    .hero2-s { list-style:none; margin:0; padding:12px 0 0; border-top:1px solid var(--line); }
    .hero2-s li { position:relative; padding:5px 16px 5px 0; font-size:15px; line-height:1.35; }
    .hero2-s li::before { content:""; position:absolute; right:2px; top:13px; width:5px; height:5px; background:#999; border-radius:50%; }
    .hero2-s a:hover { text-decoration:underline; }
    .hero2-i { display:block; }
    .im { background-size:cover; background-position:center; background-repeat:no-repeat; aspect-ratio:16/9; width:100%; background-color:#222; }
    .hero2-i .im { aspect-ratio:16/9; }              /* a 16:9 thumbnail must not be cropped: the taller 16/10.2 box cut the text off its left edge */
    .tg { font-size:12px; font-weight:800; }
    .mix { display:grid; grid-template-columns:minmax(0,1.55fr) minmax(0,1fr); gap:18px; padding-bottom:22px; }
    .mix.solo { grid-template-columns:1fr; }                      /* only one of the two columns has stories (short category head): use the full width */
    .mix.solo .mix-b, .mix.solo .mix-m { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .mix-b { display:flex; flex-direction:column; gap:12px; }
    .mix-m { display:flex; flex-direction:column; gap:14px; }
    .bt { display:grid; grid-template-columns:minmax(0,1fr) clamp(190px,34%,300px); background:var(--c); color:#fff; min-height:112px; overflow:hidden; }
    .bt-t { padding:12px 16px; display:flex; flex-direction:column; justify-content:center; min-width:0; }
    .bt h3 { margin:0 0 4px; font-size:19px; line-height:1.15; font-weight:900; }
    .bt p { margin:0 0 6px; font-size:13.5px; line-height:1.35; opacity:.92; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .bt span { font-size:12px; opacity:.8; }
    .bt-i { aspect-ratio:16/9 !important; height:auto; min-height:0; align-self:center; }   /* whole 16:9 thumbnail, never cropped to the tile's height */
    .bt:hover h3 { text-decoration:underline; }
    .cd { display:block; color:inherit; }
    .cd .cd-b { padding:9px 2px 4px; }
    .cd h3 { margin:3px 0 4px; font-size:19px; line-height:1.17; letter-spacing:-.3px; font-weight:800; }
    .cd.big h3 { font-size:25px; line-height:1.1; letter-spacing:-.7px; }
    .cd p { margin:0 0 6px; color:#444; font-size:15px; line-height:1.45; }
    .cd small, .sm small, .tr small, .fs small { color:#8a8a8a; font-size:12px; display:block; }
    .cd:hover h3, .tr:hover h4, .sm:hover h4, .fs:hover h4 { text-decoration:underline; }
    .sec { margin:0 0 26px; }
    .sec-h { display:flex; justify-content:space-between; align-items:center; background:var(--c); color:#fff; padding:7px 14px; margin:0 0 14px; }
    .sec-h b { font-size:17px; font-weight:900; }
    .sec-h a { color:#fff; font-size:13px; opacity:.92; }
    .sec-h a:hover { text-decoration:underline; }
    .row3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; }
    .strip { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; margin-top:12px; padding-top:10px; border-top:1px solid var(--line); }
    .tr { display:block; padding:10px 0; border-bottom:1px solid var(--line); color:inherit; }
    .tr h4 { margin:0 0 4px; font-size:17px; line-height:1.22; font-weight:800; }
    .strip .tr { border-bottom:0; padding:0; }
    .listimg { display:grid; grid-template-columns:minmax(0,1.9fr) minmax(0,.9fr); gap:26px; align-items:start; }
    .li-r { display:flex; flex-direction:column; gap:14px; } .li-r .sm .im { aspect-ratio:16/9; }
    .sm { display:block; color:inherit; }
    .sm h4 { margin:7px 0 3px; font-size:16.5px; line-height:1.2; font-weight:800; }
    .feat { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:26px; align-items:start; }
    .feat-s { display:flex; flex-direction:column; }
    .fs { display:grid; grid-template-columns:104px minmax(0,1fr); gap:12px; align-items:start; padding:10px 0; border-bottom:1px solid var(--line); color:inherit; }
    .fs:first-child { padding-top:0; }
    .fs .fs-i { aspect-ratio:16/10; }
    .fs h4 { margin:0 0 4px; font-size:15.5px; line-height:1.22; font-weight:800; }
    @media (max-width:900px) {
      .hero2 { grid-template-columns:1fr; } .hero2-i { order:-1; }
      .mix, .listimg, .feat, .mix.solo .mix-b, .mix.solo .mix-m { grid-template-columns:1fr; }
    }
    @media (max-width:640px) {
      .hero2 { gap:12px; padding-top:0; margin:0 -12px; }
      .hero2-t { padding:0 12px; }
      .hero2-i .im { aspect-ratio:16/9; }
      .hero2 h1 { font-size:25px; letter-spacing:-.6px; }
      .hero2 p { font-size:15px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
      .hero2-s li { font-size:14.5px; }
      .mix { gap:12px; }
      .bt { grid-template-columns:minmax(0,1fr) 40%; min-height:96px; }
      .bt h3 { font-size:16.5px; } .bt p { display:none; }
      .bt-i { min-height:0; }
      .mix-m { flex-direction:column; }
      .sec-h { margin-inline:-12px; padding-inline:12px; }
      .row3 { grid-template-columns:1fr; gap:14px; }
      .row3 .cd:nth-child(n+2) { display:grid; grid-template-columns:118px minmax(0,1fr); gap:11px; align-items:start; }
      .row3 .cd:nth-child(n+2) .cd-b { padding:0; } .row3 .cd:nth-child(n+2) h3 { font-size:16px; margin-top:0; }
      .strip { grid-template-columns:1fr; gap:0; }
      .strip .tr { padding:9px 0; border-bottom:1px solid var(--line); }
      .li-r { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
      .cd.big h3 { font-size:21px; }
      .fs { grid-template-columns:96px minmax(0,1fr); }
    }

  <header class="masthead">

  </header>

  <main id="main"><p class="empty">טוען…</p></main>
  <footer><div class="footer-inner"><span>Pawed · פורטל חדשות המבוסס על סיכומי וידאו</span><span>Summarized by Pawed (by Mr. Brosh)</span></div></footer>
<script>
const TONES = [
  'linear-gradient(135deg,#151515,#8c1d24 60%,#d7a100)','linear-gradient(135deg,#102844,#147b9b 55%,#65d2c7)',
  'linear-gradient(135deg,#193b2d,#3a9b60 55%,#d1bc55)','linear-gradient(135deg,#41235a,#b94278 55%,#f3a84c)',
  'linear-gradient(135deg,#154448,#2c9d8d 58%,#e8d36a)','linear-gradient(135deg,#263342,#64748b 55%,#d2a34c)'];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// YouTube serves a tiny grey placeholder (120px wide) for thumbnails it has not produced yet: only accept real frames,
// otherwise fall back to a generated cover that matches the episode's topic.
const THUMB_CACHE = {};
function probe(url, min){ return new Promise(res=>{ const i=new Image(); i.onload=()=>res(i.naturalWidth>=(min||300)?url:null); i.onerror=()=>res(null); i.src=url; }); }
async function bestThumb(v, img){
  if(THUMB_CACHE[v]) return THUMB_CACHE[v];
  if(img && await probe(img, 100)) return THUMB_CACHE[v]=img;        // podcast episodes carry their own artwork
  if(img) return THUMB_CACHE[v]='/vidsum/cover/'+v+'.svg';
  for(const f of ['maxresdefault','hq720','mqdefault']){ const u='https://i.ytimg.com/vi/'+v+'/'+f+'.jpg'; if(await probe(u)){ return THUMB_CACHE[v]=u; } }
  return THUMB_CACHE[v]='/vidsum/cover/'+v+'.svg';
}
function hydrateThumbs(){
  document.querySelectorAll('[data-vid]').forEach(async el=>{
    if(el.dataset.done) return; el.dataset.done='1';
    const u = await bestThumb(el.dataset.vid, el.dataset.img);
    el.style.backgroundImage = 'url('+u+'),'+(el.style.backgroundImage||'none');
  });
}
const href = a => '/vidsum/article/' + encodeURIComponent(a.slug);
// true 16:9 frames only (hqdefault/sddefault carry baked-in black bars); a failed image is skipped and the next layer shows
const bg = v => ['maxresdefault','hq720','mqdefault'].map(f=>'url(https://i.ytimg.com/vi/'+v+'/'+f+'.jpg)').join(',');
const tone = a => TONES[[...a.vid].reduce((x,c)=>x+c.charCodeAt(0),0) % TONES.length];
function when(s, hasTime){
  const d = new Date(s.replace(' ','T')+'Z'), now = new Date();   // server stores UTC
  const hm = d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
  if(d.toDateString()===now.toDateString()) return hasTime===false ? 'היום' : 'היום ב־'+hm;
  const y = new Date(now-864e5); if(d.toDateString()===y.toDateString()) return 'אתמול';
  return d.toLocaleDateString('he-IL');
}
const rel = a => when(a.released||a.created, a.released_time);
const meta = a => [a.channel, a.minutes? 'סיכום '+a.minutes+' דק׳':'', rel(a)].filter(Boolean).map(esc).join(' · ');
let DATA = null, FILTER = 'all';

const COL = {'פוליטיקה':'#b3171f','כלכלה':'#1b3f94','טכנולוגיה':'#0f2a5c','תרבות':'#6a2fa3','ספורט':'#1a7a3a','בריאות':'#0e7a6e','לייפסטייל':'#b0276a','הופעות חיות':'#c2410c','מבשלים':'#2f7d32'};
const col = t => COL[t]||'#333';
const im = (a, cls) => '<div class="im '+(cls||'')+'" data-vid="'+a.vid+'" data-img="'+esc(a.image||'')+'" style="background-image:'+tone(a)+'"></div>';
const when2 = a => esc(rel(a));
// an article can sit in up to 3 sections (a.topics, primary first); the home page groups by the primary one
const inT = (a,t) => (a.topics||[a.topic]).includes(t);
const tagOf = a => '<span class="tg" style="color:'+col(a.topic)+'">'+esc(a.topic)+'</span>';

// big hero: text on one side, large image on the other, the next stories as bullet links under it (ynet style)
function hero(a, subs){
  return '<section class="hero2"><div class="hero2-t"><div class="hero2-k">'+tagOf(a)+' · '+when2(a)+'</div>'
    +'<a href="'+href(a)+'"><h1>'+esc(a.title)+'</h1><p>'+esc(a.lead)+'</p></a><div class="hero2-m">'+meta(a)+'</div>'
    +(subs.length?'<ul class="hero2-s">'+subs.map(x=>'<li><a href="'+href(x)+'">'+esc(x.title)+'</a></li>').join('')+'</ul>':'')+'</div>'
    +'<a class="hero2-i" href="'+href(a)+'">'+im(a)+'</a></section>';
}
// dense coloured banner tile: headline block in the topic colour + image on the side
function bt(a){
  return '<a class="bt" style="--c:'+col(a.topic)+'" href="'+href(a)+'"><div class="bt-t"><h3>'+esc(a.title)+'</h3><p>'+esc(a.lead)+'</p><span>'+esc(a.topic)+' · '+when2(a)+'</span></div>'+im(a,'bt-i')+'</a>';
}
// image-over-headline card
function cd(a, big){
  return '<a class="cd'+(big?' big':'')+'" href="'+href(a)+'">'+im(a)+'<div class="cd-b">'+tagOf(a)+'<h3>'+esc(a.title)+'</h3>'+(big?'<p>'+esc(a.lead)+'</p>':'')+'<small>'+meta(a)+'</small></div></a>';
}
// text row with time stamp (news list)
function tr(a){ return '<a class="tr" href="'+href(a)+'"><h4>'+esc(a.title)+'</h4><small>'+when2(a)+' · '+esc(a.channel||'')+'</small></a>'; }
// small card for side stacks
function sm(a){ return '<a class="sm" href="'+href(a)+'">'+im(a)+'<h4>'+esc(a.title)+'</h4><small>'+esc(a.topic)+' · '+when2(a)+'</small></a>'; }

// Top story rule: the newest episode (by RELEASE date, never by when we processed it) holds the top slot until a newer one
// arrives, but never longer than 150 minutes. After that the slot moves on to the next newest, and keeps moving every
// 150 minutes (within the 5 newest) until a new episode is released and takes over again. Stateless, so everyone sees the same.
const HERO_SLOT_MS = 150*60*1000, HERO_POOL = 12;   // walks down the 12 newest, one every 150 min (then starts over)
// Morning slots (07:00-11:00 Israel time): DAILY pods (HaKarnaf and the like) take the top story, one pod per hour, rotating
// hourly through the latest episode of each daily pod released in the last 30 hours. Outside those hours (or with no fresh
// daily episode) the normal rule below applies. Category pages never rotate: their top story is simply the newest.
function ilHour(){ return +new Intl.DateTimeFormat('en-GB',{hour:'2-digit',hour12:false,timeZone:'Asia/Jerusalem'}).format(new Date()) % 24; }
function morningPick(items){
  const h = ilHour(); if(h<7 || h>=11) return -1;
  const seen = new Set(), daily = [];
  for(const a of items){                                   // items are newest first: the first hit per pod is its latest episode
    if(!a.daily || a.nohead) continue;
    const t = new Date((a.released||a.created).replace(' ','T')+'Z').getTime();
    if(Date.now()-t > 30*3600*1000) continue;
    const pod = podOf(a); if(seen.has(pod)) continue; seen.add(pod); daily.push(a);
  }
  return daily.length ? items.indexOf(daily[(h-7) % daily.length]) : -1;
}
function heroIndex(items){
  if(FILTER!=='all') return 0;
  const m = morningPick(items); if(m>=0) return m;
  const n = Math.min(HERO_POOL, items.length); if(n < 2) return okHero(items, 0);
  const t0 = new Date((items[0].released||items[0].created).replace(' ','T')+'Z').getTime();
  const age = Date.now() - t0;
  return okHero(items, age < HERO_SLOT_MS ? 0 : Math.floor(age/HERO_SLOT_MS) % n);
}
// sources flagged no_headline (good but spammy) never take the top story: move on to the next story in line
function okHero(items, k){ for(let i=0;i<items.length;i++){ const j=(k+i)%items.length; if(!items[j].nohead) return j; } return k; }
// One pod (the show / channel an episode comes from) appears at most once per block: the top block, each topic section,
// each feed batch. Across the page it also prefers pods not shown yet, and only repeats one when nothing else is left.
const byNewest = (x,y) => (y.released||'').localeCompare(x.released||'');
const podOf = a => (a.channel||a.source_id||'').trim();
function takeD(list, n, used, blockPods, pagePods){
  const out = [];
  const pass = (needFreshOnPage) => { for(const a of list){
      if(out.length>=n) break; if(used.has(a.slug)) continue;
      const pod = podOf(a); if(blockPods.has(pod)) continue;
      if(needFreshOnPage && pagePods.has(pod)) continue;
      used.add(a.slug); blockPods.add(pod); pagePods.add(pod); out.push(a); } };
  pass(true); if(out.length<n) pass(false);
  return out;
}
const take = (list, n, used) => { const out=[]; for(const a of list){ if(out.length>=n) break; if(!used.has(a.slug)){ used.add(a.slug); out.push(a); } } return out; };
function bar(topic, more){ return '<div class="sec-h" style="--c:'+col(topic)+'"><b>'+esc(topic)+'</b>'+(more?'<a href="#'+encodeURIComponent(topic)+'" data-go="'+esc(topic)+'">עוד ב'+esc(topic)+' ›</a>':'')+'</div>'; }

// each section uses a different arrangement so the page never reads as identical blocks stacked on each other
function pattern(kind, L){
  // a thin section (the pod-per-block rule leaves few stories) must not pad a two-column layout with duplicates or leave one
  // column empty: fall back to the plain card row
  if((kind===1 && L.length<6) || (kind===2 && L.length<3)) kind = 0;
  if(kind===0) return '<div class="row3">'+L.slice(0,3).map(a=>cd(a)).join('')+'</div>'+(L.length>3?'<div class="strip">'+L.slice(3,6).map(tr).join('')+'</div>':'');
  if(kind===1) return '<div class="listimg"><div class="li-l">'+L.slice(0,5).map(tr).join('')+'</div><div class="li-r">'+L.slice(5,7).map(sm).join('')+(L.length<6?L.slice(0,2).map(sm).join(''):'')+'</div></div>';
  return '<div class="feat"><div class="feat-m">'+cd(L[0],true)+'</div><div class="feat-s">'+L.slice(1,5).map(a=>'<a class="fs" href="'+href(a)+'">'+im(a,'fs-i')+'<div><h4>'+esc(a.title)+'</h4><small>'+when2(a)+'</small></div></a>').join('')+'</div></div>';
}
const need = k => k===0 ? 3 : k===1 ? 5 : 3;
function patternMix(L){ return '<div class="mix"><div class="mix-b">'+L.slice(0,4).map(bt).join('')+'</div><div class="mix-m">'+L.slice(4,6).map(a=>cd(a)).join('')+'</div></div>'; }

// ---- endless feed: after the topic sections, keep serving tiles from ALL topics (topics interleaved, newest first),
// in rotating arrangements, and circle back to the start when the content runs out.
const CHUNK_KINDS = [0, 3, 1, 2], CHUNK_SIZE = {0:6, 3:6, 1:7, 2:5};
let FEED = null;
function interleave(items, topics){
  const groups = topics.map(t=>items.filter(a=>a.topic===t)).filter(g=>g.length)
                       .sort((x,y)=>(y[0].released||'').localeCompare(x[0].released||''));
  const out=[]; for(let i=0, more=true; more; i++){ more=false; for(const g of groups){ if(i<g.length){ out.push(g[i]); more=true; } } }
  return out;
}
function startFeed(items){
  if(FEED && FEED.io) FEED.io.disconnect();
  const seq = interleave(items, DATA.topics);
  if(seq.length < 3){ FEED=null; return; }
  FEED = { seq, pos: 0, chunk: 0, busy: false, io: null };
  const sentinel = document.getElementById('sentinel');
  FEED.io = new IntersectionObserver(es=>{ if(es.some(e=>e.isIntersecting)) moreFeed(); }, {rootMargin:'900px 0px'});
  FEED.io.observe(sentinel);
  const n = parseInt(new URLSearchParams(location.search).get('chunks')||'0',10);   // ?chunks=N pre-loads N chunks (handy for testing)
  for(let i=0;i<n;i++) moreFeed(true);
}
function moreFeed(force){
  if(!FEED || FEED.busy) return; FEED.busy = true;
  const kind = CHUNK_KINDS[FEED.chunk % CHUNK_KINDS.length], n = CHUNK_SIZE[kind], L = [], N = FEED.seq.length;
  const pods = new Set(); let step = 0;
  while(L.length<n && step<N){ const a = FEED.seq[(FEED.pos+step) % N]; step++; const pod = podOf(a); if(pods.has(pod)) continue; pods.add(pod); L.push(a); }
  for(let i=0; L.length<n; i++) L.push(FEED.seq[(FEED.pos+step+i) % N]);        // not enough different pods: fill up anyway
  FEED.pos = (FEED.pos+step) % N;                                                // wraps around: the feed never ends
  const lap = FEED.chunk>0 && FEED.pos < n ? ' · סיבוב נוסף' : '';
  const head = FEED.chunk===0 ? '<div class="sec-h" style="--c:#2a211b"><b>עוד מכל התחומים</b></div>' : (FEED.chunk%4===0 ? '<div class="sec-h" style="--c:#2a211b"><b>המשך הפיד'+lap+'</b></div>' : '');
  const html = '<section class="sec feedchunk">'+head+(kind===3 ? patternMix(L) : pattern(kind, L))+'</section>';
  document.getElementById('feed2').insertAdjacentHTML('beforeend', html);
  FEED.chunk++; hydrateThumbs();
  setTimeout(()=>{ FEED.busy = false; const r = document.getElementById('sentinel').getBoundingClientRect(); if(r.top < innerHeight+900) moreFeed(); }, force?0:120);
}
let HERO_SHOWN = null;
setInterval(()=>{
  if(!DATA || FILTER===undefined) return;
  const list = FILTER==='all' ? DATA.items : DATA.items.filter(a=>inT(a,FILTER));
  if(!list.length || HERO_SHOWN===null) return;
  if(heroIndex(list)!==HERO_SHOWN && window.scrollY<300) render();
}, 60*1000);
// floating "back to top" (the feed never ends, so the footer is out of reach)
(function(){ const b=document.createElement('button'); b.id='totop'; b.textContent='↑'; b.setAttribute('aria-label','חזרה למעלה');
  b.onclick=()=>window.scrollTo({top:0,behavior:'smooth'}); document.body.appendChild(b);
  addEventListener('scroll',()=>{ b.classList.toggle('on', scrollY>1400); },{passive:true}); })();

function render(){
  if(FILTER===LIVE){ lvShow(); return; }
  if(FILTER===COOK){ ckShow(); return; }
  const all = DATA.items, main = document.getElementById('main');
  const sorted = FILTER==='all' ? all : all.filter(a=>inT(a,FILTER));
  if(!sorted.length){ main.innerHTML='<p class="empty">אין עדיין סיכומים במדור הזה — הם יופיעו כאן אוטומטית.</p>'; return; }
  const k = heroIndex(sorted); HERO_SHOWN = k;
  const items = k===0 ? sorted : [sorted[k], ...sorted.filter((_,i)=>i!==k)];   // featured story first, everything else still newest-first
  // A category's head (top story, the three under it, the first tiles) only holds articles whose PRIMARY category it is, so an
  // article is never the head of two categories. Secondary-category articles follow below, newest first.
  const prim = FILTER==='all' ? [] : items.filter(a=>a.topic===FILTER), headList = FILTER==='all' ? items : prim;      // a short list just means a shorter head: never fill it with another category's article
  const used = new Set(); let h=''; const pagePods = new Set(), topPods = new Set();
  const headOK = headList.filter(a=>!a.nohead);            // no_headline sources stay out of the top story and its three bullet links
  const top = takeD(headOK.length?headOK:headList,1,used,topPods,pagePods)[0], subs = takeD(headOK,3,used,topPods,pagePods);
  if(top) h += hero(top, subs);
  const tiles = takeD(headList,4,used,topPods,pagePods), meds = takeD(headList,2,used,topPods,pagePods);
  if(tiles.length||meds.length) h += '<section class="mix'+((!tiles.length||!meds.length)?' solo':'')+'"><div class="mix-b">'+tiles.map(bt).join('')+'</div><div class="mix-m">'+meds.map(a=>cd(a)).join('')+'</div></section>';
  const rest = items.filter(a=>!used.has(a.slug));
  if(FILTER==='all'){
    // topic sections ordered by how fresh their newest remaining story is
    const topics = DATA.topics.map(t=>({t, list: rest.filter(a=>a.topic===t)})).filter(x=>x.list.length)
                      .sort((x,y)=> (y.list[0].released||'').localeCompare(x.list[0].released||''));
    topics.forEach((x,idx)=>{
      const kind = idx%3, n = Math.min(x.list.length, kind===1?7:6);
      const L = takeD(x.list, Math.max(n, 1), used, new Set(), pagePods).sort(byNewest);   // newest at the top of every section
      h += '<section class="sec">'+bar(x.t, true)+pattern(kind, L)+'</section>';
    });
  } else {
    const pool = rest.slice();
    for(let k=0; pool.length; k++){
      const kind=k%3, n=kind===1?7:6, L=[], pods=new Set();
      for(const a of pool.slice()){ if(L.length>=n) break; const pod=podOf(a); if(pods.has(pod)) continue; pods.add(pod); L.push(a); pool.splice(pool.indexOf(a),1); }
      if(!L.length) L.push(pool.shift());
      L.sort(byNewest);
      h += '<section class="sec">'+(k===0?bar(FILTER,false):'')+pattern(kind, L)+'</section>';
    }
  }
  if(FILTER==='all') h += '<div id="feed2"></div><div id="sentinel" style="height:1px"></div>';
  main.innerHTML=h; hydrateThumbs();
  if(FILTER==='all') startFeed(all); else if(FEED && FEED.io){ FEED.io.disconnect(); FEED=null; }
  main.querySelectorAll('[data-go]').forEach(a=>a.onclick=e=>{ e.preventDefault(); FILTER=a.dataset.go; nav(); render(); window.scrollTo({top:0}); history.replaceState(null,'','#'+encodeURIComponent(FILTER)); });
}

// ---- Live Shows (upcoming Israeli events from Supercaly) ----
const LIVE = 'הופעות חיות', COOK = 'מבשלים';
let LV = null, LVF = {cat:'', city:'', q:'', when:'all', n:48};
const LV_CATS = {Music:'מוזיקה', Comedy:'סטנדאפ וקומדיה', Dance:'מחול', Festival:'פסטיבלים', Art:'אמנות'};
const lvDate = d => new Date(d+'T12:00:00');
function lvCard(e){
  const dt = lvDate(e.date), day = dt.toLocaleDateString('he-IL',{day:'numeric'}), mon = dt.toLocaleDateString('he-IL',{month:'short'}), wd = dt.toLocaleDateString('he-IL',{weekday:'long'});
  const price = e.price ? ' · מ-'+Math.round(e.price)+(e.currency==='ILS'||!e.currency?' ₪':' '+esc(e.currency)) : '';
  return '<a class="lv-c" target="_blank" rel="noopener" href="'+esc(e.link||'https://superca.ly')+'"><div class="lv-i"'+(e.image?' style="background-image:url(\''+esc(e.image)+'\')"':'')+'><div class="lv-d"><b>'+day+'</b>'+esc(mon)+'</div></div>'
    +'<div class="lv-b"><h3>'+esc(e.name)+'</h3><small>'+esc(wd)+(e.time?' · '+esc(e.time):'')+'</small><small>'+esc(e.venue)+(e.venue&&e.city?' · ':'')+esc(e.city)+esc(price)+'</small><span class="lv-go">לכרטיסים ›</span></div></a>';
}
function lvRender(){
  const main = document.getElementById('main'); if(!LV){ main.innerHTML = '<p class="empty">טוען מופעים…</p>'; return; }
  const today = new Date(); today.setHours(0,0,0,0);
  const lim = LVF.when==='week' ? 7 : LVF.when==='month' ? 31 : 0;
  const q = LVF.q.trim().toLowerCase();
  const list = LV.filter(e => (!LVF.cat || e.cats.includes(LVF.cat)) && (!LVF.city || e.city===LVF.city) && (!q || (e.name+' '+e.venue+' '+e.city).toLowerCase().includes(q))
    && (!lim || (lvDate(e.date)-today)/864e5 < lim));
  const cities = [...new Set(LV.map(e=>e.city).filter(Boolean))].sort((a,b)=>LV.filter(e=>e.city===b).length-LV.filter(e=>e.city===a).length);
  const chip = (k,l,on) => '<button data-k="'+k+'" class="'+(on?'on':'')+'">'+l+'</button>';
  main.innerHTML = '<div class="sec-h" style="--c:'+col(LIVE)+'"><b>הופעות חיות</b><span style="color:rgba(255,255,255,.9);font-size:13px">'+list.length.toLocaleString()+' מופעים קרובים בישראל</span></div>'
    +'<div class="lv-bar">'+chip('cat:','הכל',!LVF.cat)+Object.entries(LV_CATS).filter(([k])=>LV.some(e=>e.cats.includes(k))).map(([k,l])=>chip('cat:'+k,l,LVF.cat===k)).join('')
    +'<select id="lvcity"><option value="">כל הערים</option>'+cities.slice(0,40).map(c=>'<option'+(LVF.city===c?' selected':'')+'>'+esc(c)+'</option>').join('')+'</select>'
    +chip('when:all','הכל',LVF.when==='all')+chip('when:week','השבוע',LVF.when==='week')+chip('when:month','החודש',LVF.when==='month')
    +'<input id="lvq" placeholder="חיפוש אמן, מקום…" value="'+esc(LVF.q)+'"></div>'
    +(list.length?'<div class="lv-grid">'+list.slice(0,LVF.n).map(lvCard).join('')+'</div>':'<p class="empty">אין מופעים שמתאימים לסינון.</p>')
    +(list.length>LVF.n?'<button class="lv-more" id="lvmore">הצג עוד</button>':'')
    +'<div class="lv-src">המופעים מ-<a href="https://superca.ly" target="_blank" rel="noopener">Supercaly</a></div>';
  main.querySelectorAll('.lv-bar button').forEach(b=>b.onclick=()=>{ const [k,v]=b.dataset.k.split(':'); LVF[k]=v; LVF.n=48; lvRender(); });
  const c=document.getElementById('lvcity'); if(c) c.onchange=()=>{ LVF.city=c.value; LVF.n=48; lvRender(); };
  const qi=document.getElementById('lvq'); if(qi) qi.oninput=()=>{ LVF.q=qi.value; LVF.n=48; const p=qi.selectionStart; lvRender(); const n=document.getElementById('lvq'); n.focus(); n.setSelectionRange(p,p); };
  const m=document.getElementById('lvmore'); if(m) m.onclick=()=>{ LVF.n+=48; lvRender(); };
}
function lvShow(){
  if(FEED && FEED.io){ FEED.io.disconnect(); FEED=null; }
  lvRender();
  if(!LV) fetch('/api/vidsum/live').then(r=>r.json()).then(j=>{ LV=j.items||[]; if(FILTER===LIVE) lvRender(); }).catch(()=>{ LV=[]; if(FILTER===LIVE) lvRender(); });
}

// ---- מבשלים: 2 dishes of the day per group, all from cookin.jarcud.com ----
let CK = null;
function ckRender(){
  const main = document.getElementById('main'); if(!CK){ main.innerHTML='<p class="empty">טוען מנות…</p>'; return; }
  if(!CK.ok){ main.innerHTML='<p class="empty">המנות לא זמינות כרגע.</p>'; return; }
  const day = new Date(CK.day+'T12:00:00').toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'});
  const ban = (extra) => '<div class="ck-ban"><div><h2>'+(extra?'עוד '+CK.total+' מתכונים מחכים לכם':'מנות היום מהמטבח של המשפחה')+'</h2><p>'+(extra?'כל המתכונים, חיפוש לפי מה שיש לכם במקרר, תחליפים למצרכים שחסרים וסרטוני הכנה':esc(day)+' · 2 מנות מכל סוג, אחרות בכל יום')+' ב-cookin.jarcud.com</p></div>'
    +'<a class="go" target="_blank" rel="noopener" href="'+esc(CK.site)+'">לכל המתכונים ב-cookin ›</a></div>';
  main.innerHTML = '<div class="sec-h" style="--c:'+col(COOK)+'"><b>מבשלים</b><span style="color:rgba(255,255,255,.9);font-size:13px">מנות היום</span></div>'+ban(false)
    + CK.groups.map(g=>'<section class="ck-g"><h3>'+esc(g.label)+' <small>'+g.count+' מתכונים ב-cookin</small></h3><div class="ck-row">'+g.dishes.map(d=>
      '<a class="ck-c" target="_blank" rel="noopener" href="'+esc(d.url)+'"><div class="ck-i" style="background-image:url(\''+esc(d.image)+'\')"></div><div class="ck-b"><h4>'+esc(d.name)+'</h4><small>'+esc(d.time)+(d.time&&d.serves?' · ':'')+esc(d.serves)+'</small><p>'+esc(d.intro)+'</p><span class="ck-go">למתכון המלא ב-cookin ›</span></div></a>').join('')+'</div></section>').join('')
    + ban(true);
}
function ckShow(){
  if(FEED && FEED.io){ FEED.io.disconnect(); FEED=null; }
  ckRender();
  if(!CK) fetch('/api/vidsum/cooking').then(r=>r.json()).then(j=>{ CK=j; if(FILTER===COOK) ckRender(); }).catch(()=>{ CK={ok:false}; if(FILTER===COOK) ckRender(); });
}
function nav(){
  const n=document.getElementById('nav');
  n.innerHTML=['all',...DATA.topics,LIVE,COOK].map(t=>'<button data-f="'+esc(t)+'" class="'+(t===FILTER?'active':'')+'">'+(t==='all'?'ראשי':esc(t))+'</button>').join('');
  n.querySelectorAll('button').forEach(b=>b.onclick=()=>{FILTER=b.dataset.f; nav(); render(); history.replaceState(null,'', FILTER==='all'?location.pathname:'#'+encodeURIComponent(FILTER));});
}
document.getElementById('today').textContent = new Date().toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

// after sign-in, point at the Sources link (once: until they open it or close the bubble)
function showSourcesHint(){
  let seen=false; try{ seen = localStorage.getItem('pawed_srchint')==='1'; }catch(e){}
  if(seen) return;
  let tries=0;
  const iv=setInterval(()=>{
    const a=document.querySelector('.utility-links a[href="/vidsum/sources"]');
    if(!a || !a.offsetParent){ if(++tries>30) clearInterval(iv); return; }
    clearInterval(iv);
    const done=()=>{ try{ localStorage.setItem('pawed_srchint','1'); }catch(e){} a.classList.remove('hint-pulse'); const b=document.getElementById('srchint'); if(b) b.remove(); removeEventListener('resize',place); removeEventListener('scroll',place); };
    a.classList.add('hint-pulse'); a.addEventListener('click',done,{once:true});
    a.scrollIntoView({block:'nearest',inline:'center'});
    const b=document.createElement('div'); b.id='srchint';
    b.innerHTML='<span class="x" aria-label="close">×</span>Add Your Podcast Channels Here<small>הוסיפו כאן את ערוצי הפודקאסטים שלכם</small>';
    b.onclick=e=>{ if(e.target.className==='x') done(); else location.href='/vidsum/sources'; };
    document.body.appendChild(b);
    function place(){ const r=a.getBoundingClientRect(), w=b.offsetWidth; let left=r.left+r.width/2-w/2; left=Math.max(8,Math.min(innerWidth-w-8,left));
      b.style.left=left+'px'; b.style.top=(r.bottom+10)+'px'; b.style.setProperty('--ax',(r.left+r.width/2-left)+'px'); }
    place(); addEventListener('resize',place); addEventListener('scroll',place,{passive:true});
  },200);
}
fetch('/api/vidsum/news').then(r=>r.json()).then(j=>{
  DATA=j; const h=decodeURIComponent(location.hash.slice(1)); if(j.topics.includes(h) || h===LIVE || h===COOK || h==='Live Shows') FILTER = h==='Live Shows' ? LIVE : h;
  const ul=document.querySelector('.utility-links');
  if(ul && j.me){ const a=document.createElement('a'); a.href='/vidsum/sources'; a.textContent = 'שלום '+j.me.name+(j.personal?' · תצוגה מותאמת':''); a.style.fontWeight='700'; ul.appendChild(a); }
  document.getElementById('cta').hidden = !!j.me;
  if(j.me) showSourcesHint();
  const mins = j.items.reduce((t,a)=>t+(a.minutes||0),0), hrs = Math.round(mins/60);
  const hn = hrs>=1 ? hrs : Math.round(mins/6)/10;                    // under an hour: one decimal
  document.getElementById('count').innerHTML = '<b>'+hn.toLocaleString('en-US')+'</b> שעות האזנה<br><span dir="ltr">'+hn.toLocaleString('en-US')+' Listening Hours</span>';
  nav(); render();
}).catch(()=>{document.getElementById('main').innerHTML='<p class="empty">שגיאה בטעינה</p>';});
</script>
