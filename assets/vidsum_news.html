// Top story rule: the newest episode (by RELEASE date, never by when we processed it) holds the top slot until a newer one
// arrives, but never longer than 150 minutes. After that the slot moves on to the next newest, and keeps moving every
// 150 minutes (within the 5 newest) until a new episode is released and takes over again. Stateless, so everyone sees the same.
const HERO_SLOT_MS = 150*60*1000, HERO_POOL = 12;   // walks down the 12 newest, one every 150 min (then starts over)
// Morning slots (07:00-11:00 Israel time): DAILY pods (HaKarnaf and the like) take the top story, one pod per hour, rotating
// hourly through the latest episode of each daily pod released in the last 30 hours. Outside those hours (or with no fresh
// daily episode) the normal rule below applies. Category pages never rotate: their top story is simply the newest.
function ilHour(){ return +new Intl.DateTimeFormat('en-GB',{hour:'2-digit',hour12:false,timeZone:'Asia/Jerusalem'}).format(new Date()) % 24; }
// Main page rule: Sports and Lifestyle never take a head slot (top story, its three links, the first tiles) on the main page; they keep their own sections below
const HOME_NOHEAD = new Set(['ספורט','לייפסטייל']);
const noHead = a => a.nohead || (FILTER==='all' && HOME_NOHEAD.has(a.topic));
function morningPick(items){
  const h = ilHour(); if(h<7 || h>=11) return -1;
  const seen = new Set(), daily = [];
  for(const a of items){                                   // items are newest first: the first hit per pod is its latest episode
    if(!a.daily || noHead(a)) continue;
    const t = new Date((a.released||a.created).replace(' ','T')+'Z').getTime();
    if(Date.now()-t > 30*3600*1000) continue;
    const pod = podOf(a); if(seen.has(pod)) continue; seen.add(pod); daily.push(a);
  }
  return daily.length ? items.indexOf(daily[(h-7) % daily.length]) : -1;
}
function heroIndex(items){
  if(FILTER!=='all') return 0;
  const m = morningPick(items); if(m>=0) return m;
  const n = Math.min(HERO_POOL, items.length); if(n < 2) return okHero(items, 0);
  const t0 = new Date((items[0].released||items[0].created).replace(' ','T')+'Z').getTime();
  const age = Date.now() - t0;
  return okHero(items, age < HERO_SLOT_MS ? 0 : Math.floor(age/HERO_SLOT_MS) % n);
}
// sources flagged no_headline (good but spammy) never take the top story: move on to the next story in line
function okHero(items, k){ for(let i=0;i<items.length;i++){ const j=(k+i)%items.length; if(!noHead(items[j])) return j; } return k; }
// One pod (the show / channel an episode comes from) appears at most once per block: the top block, each topic section,
// each feed batch. Across the page it also prefers pods not shown yet, and only repeats one when nothing else is left.
const byNewest = (x,y) => (y.released||'').localeCompare(x.released||'');
const podOf = a => (a.channel||a.source_id||'').trim();
const tsOf = a => Date.parse(String(a.released||a.created||'').replace(' ','T').replace(/Z?$/,'Z')) || 0;
function takeD(list, n, used, blockPods, pagePods){
  // one pod once per block and pods not yet on the page first, but NEVER at the price of freshness (a pod whose newest story is
  // months old must not jump the queue) and never at the price of an empty slot: when the preferences run out the block is filled
  // with the next newest stories, whatever pod they come from.
  const out = [], newest = list.length ? tsOf(list[0]) : 0, recent = a => tsOf(a) >= newest - 21*864e5;
  const passes = [a=>!blockPods.has(podOf(a)) && !pagePods.has(podOf(a)) && recent(a), a=>!blockPods.has(podOf(a)) && recent(a),
                  a=>recent(a), a=>!blockPods.has(podOf(a)), a=>true];
  for(const ok of passes){
    for(const a of list){
      if(out.length>=n) break; if(used.has(a.slug) || !ok(a)) continue;
      used.add(a.slug); blockPods.add(podOf(a)); pagePods.add(podOf(a)); out.push(a); }
    if(out.length>=n) break;
  }
  return out;
}
const take = (list, n, used) => { const out=[]; for(const a of list){ if(out.length>=n) break; if(!used.has(a.slug)){ used.add(a.slug); out.push(a); } } return out; };
function bar(topic, more){ return '<div class="sec-h" style="--c:'+col(topic)+'"><b>'+esc(TN(topic))+'</b>'+(more?'<a href="#'+encodeURIComponent(topic)+'" data-go="'+esc(topic)+'">'+t('moreIn')+esc(TN(topic))+' ›</a>':'')+'</div>'; }

// each section uses a different arrangement so the page never reads as identical blocks stacked on each other
function pattern(kind, L){
  // a thin section (the pod-per-block rule leaves few stories) must not pad a two-column layout with duplicates or leave one
  // column empty: fall back to the plain card row
  if((kind===1 && L.length<6) || (kind===2 && L.length<3)) kind = 0;
  if(kind===0) return '<div class="row3">'+L.slice(0,3).map(a=>cd(a)).join('')+'</div>'+(L.length>3?'<div class="strip">'+L.slice(3,6).map(tr).join('')+'</div>':'');
  if(kind===1) return '<div class="listimg"><div class="li-l">'+L.slice(0,5).map(tr).join('')+'</div><div class="li-r">'+L.slice(5,7).map(sm).join('')+(L.length<6?L.slice(0,2).map(sm).join(''):'')+'</div></div>';
  return '<div class="feat"><div class="feat-m">'+cd(L[0],true)+'</div><div class="feat-s">'+L.slice(1,5).map(a=>'<a class="fs" href="'+href(a)+'">'+im(a,'fs-i')+'<div><h4>'+esc(a.title)+'</h4><small>'+when2(a)+'</small></div></a>').join('')+'</div></div>';
}
const need = k => k===0 ? 3 : k===1 ? 5 : 3;
function patternMix(L){ return '<div class="mix"><div class="mix-b">'+L.slice(0,4).map(bt).join('')+'</div><div class="mix-m">'+L.slice(4,6).map(a=>cd(a)).join('')+'</div></div>'; }

// ---- endless feed: after the topic sections, keep serving tiles from ALL topics (topics interleaved, newest first),
// in rotating arrangements, and circle back to the start when the content runs out.
const CHUNK_KINDS = [0, 3, 1, 2], CHUNK_SIZE = {0:6, 3:6, 1:7, 2:5};
let FEED = null;
function interleave(items, topics){
  const groups = topics.map(t=>items.filter(a=>a.topic===t)).filter(g=>g.length)
                       .sort((x,y)=>(y[0].released||'').localeCompare(x[0].released||''));
  const out=[]; for(let i=0, more=true; more; i++){ more=false; for(const g of groups){ if(i<g.length){ out.push(g[i]); more=true; } } }
  return out;
}
function startFeed(items){
  if(FEED && FEED.io) FEED.io.disconnect();
  const seq = interleave(items, DATA.topics);
  if(seq.length < 3){ FEED=null; return; }
  FEED = { seq, pos: 0, chunk: 0, busy: false, io: null };
  const sentinel = document.getElementById('sentinel');
  FEED.io = new IntersectionObserver(es=>{ if(es.some(e=>e.isIntersecting)) moreFeed(); }, {rootMargin:'900px 0px'});
  FEED.io.observe(sentinel);
  const n = parseInt(new URLSearchParams(location.search).get('chunks')||'0',10);   // ?chunks=N pre-loads N chunks (handy for testing)
  for(let i=0;i<n;i++) moreFeed(true);
}
function moreFeed(force){
  if(!FEED || FEED.busy) return; FEED.busy = true;
  const kind = CHUNK_KINDS[FEED.chunk % CHUNK_KINDS.length], n = CHUNK_SIZE[kind], L = [], N = FEED.seq.length;
  const pods = new Set(); let step = 0;
  while(L.length<n && step<N){ const a = FEED.seq[(FEED.pos+step) % N]; step++; const pod = podOf(a); if(pods.has(pod)) continue; pods.add(pod); L.push(a); }
  for(let i=0; L.length<n; i++) L.push(FEED.seq[(FEED.pos+step+i) % N]);        // not enough different pods: fill up anyway
  FEED.pos = (FEED.pos+step) % N;                                                // wraps around: the feed never ends
  const lap = FEED.chunk>0 && FEED.pos < n ? t('lap') : '';
  const head = FEED.chunk===0 ? '<div class="sec-h" style="--c:#2a211b"><b>'+t('more2')+'</b></div>' : (FEED.chunk%4===0 ? '<div class="sec-h" style="--c:#2a211b"><b>'+t('cont')+lap+'</b></div>' : '');
  const html = '<section class="sec feedchunk">'+head+(kind===3 ? patternMix(L) : pattern(kind, L))+'</section>';
  document.getElementById('feed2').insertAdjacentHTML('beforeend', html);
  FEED.chunk++; hydrateThumbs();
  setTimeout(()=>{ FEED.busy = false; const r = document.getElementById('sentinel').getBoundingClientRect(); if(r.top < innerHeight+900) moreFeed(); }, force?0:120);
}
let HERO_SHOWN = null;
setInterval(()=>{
  if(!DATA || FILTER===undefined) return;
  const list = FILTER==='all' ? DATA.items : DATA.items.filter(a=>inT(a,FILTER));
  if(!list.length || HERO_SHOWN===null) return;
  if(heroIndex(list)!==HERO_SHOWN && window.scrollY<300) render();
}, 60*1000);
// floating "back to top" (the feed never ends, so the footer is out of reach)
(function(){ const b=document.createElement('button'); b.id='totop'; b.textContent='↑'; b.setAttribute('aria-label',t('totop'));
  b.onclick=()=>window.scrollTo({top:0,behavior:'smooth'}); document.body.appendChild(b);
  addEventListener('scroll',()=>{ b.classList.toggle('on', scrollY>1400); },{passive:true}); })();

function render(){
  if(FILTER===LIVE){ lvShow(); return; }
  if(FILTER===COOK){ ckShow(); return; }
  const all = DATA.items, main = document.getElementById('main');
  const sorted = FILTER==='all' ? all : all.filter(a=>inT(a,FILTER));
  if(!sorted.length){ main.innerHTML='<p class="empty">'+t('emptyTopic')+'</p>'; return; }
  const k = heroIndex(sorted); HERO_SHOWN = k;
  const items = k===0 ? sorted : [sorted[k], ...sorted.filter((_,i)=>i!==k)];   // featured story first, everything else still newest-first
  // A category's head (top story, the three under it, the first tiles) only holds articles whose PRIMARY category it is, so an
  // article is never the head of two categories. Secondary-category articles follow below, newest first.
  const prim = FILTER==='all' ? [] : items.filter(a=>a.topic===FILTER), headList = FILTER==='all' ? (items.filter(a=>!HOME_NOHEAD.has(a.topic)).length ? items.filter(a=>!HOME_NOHEAD.has(a.topic)) : items) : prim;      // a short list just means a shorter head: never fill it with another category's article
  const used = new Set(); let h=''; const pagePods = new Set(), topPods = new Set();
  const headOK = headList.filter(a=>!noHead(a));            // no_headline sources stay out of the top story and its three bullet links
  const top = takeD(headOK.length?headOK:headList,1,used,topPods,pagePods)[0], subs = takeD(headOK,3,used,topPods,pagePods);
  if(top) h += hero(top, subs);
  const mixPods = new Set(), tiles = takeD(headList,4,used,mixPods,pagePods), meds = takeD(headList,2,used,mixPods,pagePods);
  if(tiles.length||meds.length) h += '<section class="mix'+((!tiles.length||!meds.length)?' solo':'')+'"><div class="mix-b">'+tiles.map(bt).join('')+'</div><div class="mix-m">'+meds.map(a=>cd(a)).join('')+'</div></section>';
  const rest = items.filter(a=>!used.has(a.slug));
  if(FILTER==='all'){
    // topic sections ordered by how fresh their newest remaining story is
    const topics = DATA.topics.map(t=>({t, list: rest.filter(a=>a.topic===t)})).filter(x=>x.list.length)
                      .sort((x,y)=> (y.list[0].released||'').localeCompare(x.list[0].released||''));
    topics.forEach((x,idx)=>{
      const kind = idx%3, n = Math.min(x.list.length, kind===1?7:6);
      const L = takeD(x.list, Math.max(n, 1), used, new Set(), pagePods).sort(byNewest);   // newest at the top of every section
      h += '<section class="sec">'+bar(x.t, true)+pattern(kind, L)+'</section>';
    });
  } else {
    let pool = rest.slice(); const usedC = new Set();
    for(let k=0; pool.length; k++){
      const kind=k%3, n=kind===1?7:6, L = takeD(pool, n, usedC, new Set(), new Set());
      if(!L.length) break;
      pool = pool.filter(a=>!usedC.has(a.slug));
      L.sort(byNewest);
      h += '<section class="sec">'+(k===0?bar(FILTER,false):'')+pattern(kind, L)+'</section>';
    }
  }
  if(FILTER==='all') h += '<div id="feed2"></div><div id="sentinel" style="height:1px"></div>';
  main.innerHTML=h; hydrateThumbs();
  if(FILTER==='all') startFeed(all); else if(FEED && FEED.io){ FEED.io.disconnect(); FEED=null; }
  main.querySelectorAll('[data-go]').forEach(a=>a.onclick=e=>{ e.preventDefault(); FILTER=a.dataset.go; nav(); render(); window.scrollTo({top:0}); history.replaceState(null,'','#'+encodeURIComponent(FILTER)); });
}

  if(FILTER!=='all' && FILTER!==LIVE && FILTER!==COOK && !live.includes(FILTER)) FILTER='all';
  n.innerHTML=['all',...live,LIVE,COOK].map(t=>'<button data-f="'+esc(t)+'" class="'+(t===FILTER?'active':'')+'">'+(t==='all'?t_('main'):esc(TN(t)))+'</button>').join('');
  n.querySelectorAll('button').forEach(b=>b.onclick=()=>{FILTER=b.dataset.f; nav(); render(); if(innerWidth<=640){ const w=document.querySelector('.nav-wrap'); if(w) w.scrollIntoView({behavior:'smooth',block:'start'}); } history.replaceState(null,'', FILTER==='all'?location.pathname:'#'+encodeURIComponent(FILTER));});
}
document.getElementById('today').textContent = new Date().toLocaleDateString(LOC,{weekday:'long',day:'numeric',month:'long',year:'numeric'});

// after sign-in, point at the Sources link (once: until they open it or close the bubble)
function showSourcesHint(){
  let seen=false; try{ seen = localStorage.getItem('pawed_srchint')==='1'; }catch(e){}
  if(seen) return;
  let tries=0;
  const iv=setInterval(()=>{
    const a=document.querySelector('.utility-links a[href="/vidsum/sources"]');
    if(!a || !a.offsetParent){ if(++tries>30) clearInterval(iv); return; }
    clearInterval(iv);
    const done=()=>{ try{ localStorage.setItem('pawed_srchint','1'); }catch(e){} a.classList.remove('hint-pulse'); const b=document.getElementById('srchint'); if(b) b.remove(); removeEventListener('resize',place); removeEventListener('scroll',place); };
    a.classList.add('hint-pulse'); a.addEventListener('click',done,{once:true});
    a.scrollIntoView({block:'nearest',inline:'center'});
    const b=document.createElement('div'); b.id='srchint';
    b.innerHTML='<span class="x" aria-label="close">×</span>Add Your Podcast Channels Here<small>'+(EN?'':t('hint'))+'</small>';
    b.onclick=e=>{ if(e.target.className==='x') done(); else location.href='/vidsum/sources'; };
    document.body.appendChild(b);
    function place(){ const r=a.getBoundingClientRect(), w=b.offsetWidth; let left=r.left+r.width/2-w/2; left=Math.max(8,Math.min(innerWidth-w-8,left));
      b.style.left=left+'px'; b.style.top=(r.bottom+10)+'px'; b.style.setProperty('--ax',(r.left+r.width/2-left)+'px'); }
    place(); addEventListener('resize',place); addEventListener('scroll',place,{passive:true});
  },200);
}
fetch('/api/vidsum/news').then(r=>r.json()).then(j=>{
  if(EN) j.items.forEach(a=>{ if(a.title_en){ a.title=a.title_en; a.lead=a.lead_en||a.lead; } });
  applyStatic();
  DATA=j; PLAT=j.platform||''; const h=decodeURIComponent(location.hash.slice(1)); if(j.topics.includes(h) || h===LIVE || h===COOK || h==='Live Shows') FILTER = h==='Live Shows' ? LIVE : h;
  const ul=document.querySelector('.utility-links');
  if(ul && j.me){ const a=document.createElement('a'); a.href='/vidsum/sources'; a.textContent = t('hello')+j.me.name+(j.personal?t('personal'):''); a.style.fontWeight='700'; ul.appendChild(a); }
  document.getElementById('cta').hidden = !!j.me;
  if(j.me) showSourcesHint();
  nav(); render();
}).catch(()=>{document.getElementById('main').innerHTML='<p class="empty">'+t('loadErr')+'</p>';});
</script>
