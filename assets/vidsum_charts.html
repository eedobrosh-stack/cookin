const T=S[LANG]||S.en, tt=k=>T[k]||S.en[k]||k;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
let RN, LN; try{ const IL=LANG==='zh'?'zh-TW':LANG==='no'?'nb':LANG; RN=new Intl.DisplayNames([IL],{type:'region'}); LN=new Intl.DisplayNames([IL],{type:'language'}); }catch(e){}
const regionName=(c,fb)=>{ try{ return (RN&&RN.of(c.toUpperCase()))||fb; }catch(e){ return fb; } };
const langName=(c,fb)=>{ try{ return (LN&&LN.of(c))||fb; }catch(e){ return fb; } };
const FLAG=c=>c.length===2?String.fromCodePoint(...c.toUpperCase().split('').map(x=>127397+x.charCodeAt(0))):'';
let OPT=null, SEL={country:new Set(),language:new Set(),genre:new Set()}, PAGE=1, ME={signed:false}, DATA=null;

function readUrl(){ const q=new URLSearchParams(location.search); for(const k of Object.keys(SEL)) SEL[k]=new Set((q.get(k)||'').split(',').filter(Boolean)); PAGE=Math.max(1,parseInt(q.get('page')||'1',10)||1); }
function writeUrl(){ const q=new URLSearchParams(); for(const k of Object.keys(SEL)) if(SEL[k].size) q.set(k,[...SEL[k]].join(',')); if(PAGE>1) q.set('page',PAGE); history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:'')); }

function labelOf(kind,v){
  if(kind==='country'){ const o=OPT.countries.find(x=>x.code===v); return FLAG(v)+' '+regionName(v,o?o.name:v); }
  if(kind==='language'){ const o=OPT.languages.find(x=>x.code===v); return langName(v,o?o.name:v); }
  return v;
}
function items(kind){
  if(kind==='country') return OPT.countries.map(o=>({v:o.code,n:o.n,l:labelOf('country',o.code)}));
  if(kind==='language') return OPT.languages.map(o=>({v:o.code,n:o.n,l:labelOf('language',o.code)}));
  return OPT.genres.map(o=>({v:o.name,n:o.n,l:o.name}));
}
function buildFilters(){
  const kinds=[['country',tt('country')],['language',tt('language')],['genre',tt('category')]];
  const open=new Set([...document.querySelectorAll('details.f[open]')].map(d=>d.dataset.k));
  $('filters').innerHTML=kinds.map(([k,name])=>{
    const n=SEL[k].size;
    return '<details class="f" data-k="'+k+'"'+(open.has(k)?' open':'')+'><summary><span>'+esc(name)+'</span>'+(n?'<span class="cnt">'+n+'</span>':'')+'</summary><div class="panel"><input type="search" placeholder="'+esc(tt('search'))+'"><div class="list">'+
      items(k).map(it=>'<label data-s="'+esc(it.l.toLowerCase())+'"><input type="checkbox" value="'+esc(it.v)+'"'+(SEL[k].has(it.v)?' checked':'')+'><span>'+esc(it.l)+'</span><small>'+it.n.toLocaleString()+'</small></label>').join('')+
      '</div><button class="clr" type="button">'+esc(tt('clear'))+'</button></div></details>';
  }).join('');
  document.querySelectorAll('details.f').forEach(d=>{
    const k=d.dataset.k;
    d.querySelector('input[type=search]').oninput=e=>{ const q=e.target.value.trim().toLowerCase(); d.querySelectorAll('label').forEach(l=>l.style.display=!q||l.dataset.s.includes(q)?'':'none'); };
    d.querySelectorAll('label input').forEach(c=>c.onchange=()=>{ c.checked?SEL[k].add(c.value):SEL[k].delete(c.value); PAGE=1; load(true); });
    d.querySelector('.clr').onclick=()=>{ SEL[k].clear(); PAGE=1; load(true); };
  });
  $('chips').innerHTML=kinds.flatMap(([k])=>[...SEL[k]].map(v=>'<span class="chip" data-k="'+k+'" data-v="'+esc(v)+'">'+esc(labelOf(k,v))+'</span>')).join('');
  $('chips').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ SEL[c.dataset.k].delete(c.dataset.v); PAGE=1; load(true); });
}
document.addEventListener('click',e=>{ document.querySelectorAll('details.f[open]').forEach(d=>{ if(!d.contains(e.target)) d.open=false; }); });

function cadLabel(c){ if(!c) return '–'; const irr=/\(irregular\)/.test(c), b=c.replace(' (irregular)',''); return esc(tt(b))+(irr?' <small style="color:#999">('+esc(tt('irr'))+')</small>':''); }
function fmtDate(s){ if(!s) return '–'; try{ return new Date(s+'T12:00:00').toLocaleDateString(LANG,{year:'numeric',month:'short',day:'numeric'}); }catch(e){ return s; } }

function render(){
  const d=DATA, rows=d.pods;
  $('thead').innerHTML='<tr><th>'+tt('pos')+'</th><th>'+tt('pod')+'</th><th>'+tt('rank')+'</th><th>'+tt('eps')+'</th><th>'+tt('cad')+'</th><th>'+tt('last')+'</th><th>'+tt('category')+'</th><th></th></tr>';
  $('empty').hidden=!!rows.length; $('empty').textContent=tt('none');
  const rng=d.total?(d.from.toLocaleString()+'–'+d.to.toLocaleString()+' '+tt('of')+' '+d.total.toLocaleString()):'0';
  $('range').innerHTML='<b>'+rng+'</b>'; $('range2').textContent=rng;
  $('prev').disabled=d.page<=1; $('next').disabled=d.to>=d.total;
  $('rows').innerHTML=rows.map(p=>{
    const ctry=p.countries.map(c=>FLAG(c.code)+(c.rank?' #'+c.rank:'')).join('  ');
    const btn=p.added?'<button class="add" disabled>'+esc(tt('added'))+'</button>':'<button class="add" data-id="'+esc(p.id)+'">'+esc(tt('add'))+'</button>';
    return '<tr><td class="pos">'+p.pos+'</td><td><div class="pod">'+(p.image?'<img loading="lazy" src="'+esc(p.image)+'" alt="">':'<img alt="">')+'<div><b>'+(p.link?'<a href="'+esc(p.link)+'" target="_blank" rel="noopener">'+esc(p.name)+'</a>':esc(p.name))+'</b><small>'+esc((p.hosts||[]).join(', '))+'</small></div></div></td>'+
      '<td><span class="rk">'+p.points.toLocaleString()+'</span><div class="ctry">'+ctry+'</div></td><td>'+(p.episodes!=null?p.episodes.toLocaleString():'–')+'</td><td>'+cadLabel(p.cadence)+'</td><td>'+fmtDate(p.last_ep)+'</td>'+
      '<td class="gen">'+esc(langName(p.language,p.language))+' · '+esc((p.genres||[]).join(', '))+'</td><td>'+btn+'</td></tr>';
  }).join('');
  $('rows').querySelectorAll('button.add[data-id]').forEach(b=>b.onclick=()=>addSource(b));
}
let tmr; function toast(html,cls,keep){ const t=$('toast'); t.className=cls||''; t.innerHTML=html; t.style.display='block'; clearTimeout(tmr); if(!keep) tmr=setTimeout(()=>t.style.display='none',9000); }
async function addSource(b){
  if(!ME.signed){ toast(esc(tt('signin'))+' · <a href="/auth/login?next='+encodeURIComponent(location.pathname+location.search)+'">'+esc(tt('signinlink'))+'</a>','info',true); return; }
  b.disabled=true; const name=b.closest('tr').querySelector('.pod b').textContent;
  try{
    const r=await fetch('/api/vidsum/sources/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({catalog_id:b.dataset.id})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||j.ok===false) throw new Error(j.error||('HTTP '+r.status));
    b.textContent=tt('added'); toast(esc(tt('ok').replace('{n}','1')));
  }catch(e){ b.disabled=false; toast(esc(tt('notadded')+name+' ('+e.message+')'),'err'); }
}
async function load(rebuild){
  writeUrl(); if(rebuild) buildFilters();
  const q=new URLSearchParams({page:PAGE}); for(const k of Object.keys(SEL)) if(SEL[k].size) q.set(k,[...SEL[k]].join(','));
  $('rows').style.opacity=.4;
  try{ DATA=await (await fetch('/api/vidsum/charts?'+q)).json(); }catch(e){ DATA={pods:[],total:0,page:1,from:0,to:0}; }
  $('rows').style.opacity=1; render();
}
$('prev').onclick=()=>{ PAGE=Math.max(1,PAGE-1); load(); window.scrollTo({top:0,behavior:'smooth'}); };
$('next').onclick=()=>{ PAGE++; load(); window.scrollTo({top:0,behavior:'smooth'}); };
(async function(){
  document.title=tt('title')+' | Pawed'; $('h1').textContent=tt('title'); $('ix').textContent=LANG==='he'?'אינדקס':(window.piT?piT('Index',LANG):'Index'); $('lead').textContent=tt('lead'); $('back').textContent=tt('back'); $('note').textContent=tt('note');
  $('prev').textContent=tt('prev'); $('next').textContent=tt('next');
  readUrl();
  try{ ME=await (await fetch('/api/vidsum/me')).json(); }catch(e){}
  try{ OPT=await (await fetch('/api/vidsum/charts/options')).json(); }catch(e){ OPT={countries:[],languages:[],genres:[]}; }
  await load(true);
})();
</script>
