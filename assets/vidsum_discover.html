<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127916;</text></svg>">
<title>Vidsum Discover</title>
<style>
  :root { --bg:#14161b; --card:#1d2129; --line:#2e3442; --ink:#e8eaf0;
          --muted:#8b93a7; --accent:#4f8cff; --ok:#3ec97e; --err:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:34px 18px 70px; }
  h1 { margin:0 0 4px; font-size:1.5rem; }
  p.sub { margin:0 0 18px; color:var(--muted); font-size:.9rem; line-height:1.5; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 18px; }
  .tab { padding:9px 15px; border-radius:10px; border:1px solid var(--line);
         background:var(--card); color:var(--muted); font-size:.88rem; font-weight:600;
         cursor:pointer; }
  .tab.on { border-color:var(--accent); color:var(--ink); background:#20304d; }
  .pane { display:none; } .pane.on { display:block; }
  .searchrow { display:flex; gap:10px; }
  input[type=text], input[type=url] { flex:1; padding:11px 13px; border-radius:9px;
          border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:.95rem; }
  input:focus { outline:none; border-color:var(--accent); }
  select { flex:1; padding:11px 13px; border-radius:9px; border:1px solid var(--line);
           background:var(--card); color:var(--ink); font-size:.95rem; }
  button { padding:11px 18px; border:0; border-radius:9px; background:var(--accent);
           color:#fff; font-size:.92rem; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  .chips { margin:12px 0 4px; display:flex; flex-wrap:wrap; gap:8px; }
  .chip { padding:6px 13px; border-radius:20px; border:1px solid var(--line);
          background:var(--card); color:var(--muted); font-size:.83rem; cursor:pointer; }
  .chip:hover { border-color:var(--accent); color:var(--ink); }
  #status { margin:16px 0 8px; font-size:.88rem; color:var(--muted); min-height:1.2em; }
  #status.err { color:var(--err); } #status.ok { color:var(--ok); }
  .podhead { margin:20px 0 8px; font-size:1rem; font-weight:700; }
  .podhead small { color:var(--muted); font-weight:400; margin-inline-start:8px; }
  .ep { padding:13px 14px; margin:0 0 10px; background:var(--card);
        border:1px solid var(--line); border-radius:12px; }
  .eprow { display:flex; gap:12px; align-items:flex-start; cursor:pointer; }
  .eprow input { margin-top:4px; width:16px; height:16px; accent-color:var(--accent); flex:none; }
  .ep .t { font-weight:600; font-size:.95rem; line-height:1.35; }
  .ep .m { color:var(--muted); font-size:.8rem; margin-top:3px; }
  .ep a { color:var(--accent); text-decoration:none; }
  .exp { flex:none; width:26px; height:26px; border-radius:7px; border:1px solid var(--line);
         background:transparent; color:var(--muted); font-size:1rem; font-weight:700;
         line-height:1; padding:0; margin-left:auto; }
  .exp:hover { border-color:var(--accent); color:var(--ink); }
  .detail { display:none; margin:10px 0 0 28px; padding:10px 12px; border-radius:8px;
            background:#161a22; color:#c6ccda; font-size:.85rem; line-height:1.55;
            white-space:pre-wrap; }
  .detail.on { display:block; }
  .detail .orig { color:var(--muted); font-size:.78rem; margin-bottom:6px; }
  .mapwrap { overflow-x:auto; border:1px solid var(--line); border-radius:14px;
             background:#10141c; }
  .mapbox { position:relative; min-width:680px; }
  .mapbox svg { display:block; width:100%; height:auto; }
  .mapbox .land { fill:#2b3345; stroke:#10141c; stroke-width:.6; }
  .flag { position:absolute; transform:translate(-50%,-50%); font-size:16px; line-height:1;
          cursor:pointer; user-select:none; transition:transform .15s;
          filter:drop-shadow(0 1px 2px rgba(0,0,0,.8)); z-index:2; }
  .flag:hover { transform:translate(-50%,-50%) scale(1.9); z-index:6; }
  .flag.on { transform:translate(-50%,-50%) scale(1.6); z-index:5;
             text-shadow:0 0 10px var(--accent); }
  .srcs { display:inline-flex; gap:8px; margin-inline-start:8px; vertical-align:-2px; }
  .srcs a { display:inline-flex; opacity:.75; }
  .srcs a:hover { opacity:1; }
  .maphint { color:var(--muted); font-size:.82rem; margin:8px 2px 0; }
  .batchbar { position:sticky; bottom:0; padding:12px 0 6px;
              background:linear-gradient(transparent, var(--bg) 30%); }
  .batchbar button { width:100%; padding:14px; font-size:1rem; }
</style>
<div class="wrap">
  <h1>&#127916; Vidsum Discover</h1>
  <p class="sub">Find episodes four ways, check the ones you want, and queue them for
  summarization.</p>
  <div class="tabs">
    <span class="tab on" data-pane="link">&#128279; Link</span>
    <span class="tab" data-pane="topic">&#128269; Topic</span>
    <span class="tab" data-pane="geo">&#127757; Popular by GEO</span>
    <span class="tab" data-pane="mine">&#11088; My Podcasts</span>
  </div>

  <div class="pane on" id="pane-link">
    <form class="searchrow" id="lf">
      <input type="url" id="link" placeholder="Paste a YouTube / Spotify / Zoom link…" required>
      <button id="linkbtn">Queue link</button>
    </form>
  </div>

  <div class="pane" id="pane-topic">
    <form class="searchrow" id="sf">
      <input type="text" id="topic" placeholder="Topic — e.g. AI, Israeli politics, cybersecurity…" required>
      <button id="searchbtn">Search</button>
    </form>
    <div class="chips" id="chips"></div>
  </div>

      </svg>
    </div></div>
    <p class="maphint">Tap a flag to load that country's top-20 podcasts.</p>
  </div>

  <div class="pane" id="pane-mine">
    <form class="searchrow" id="mf">
      <button id="minebtn" style="width:100%">Show latest episodes of my followed podcasts</button>
    </form>
  </div>

  <p id="status"></p>
  <div id="results"></div>
  <div class="batchbar" id="batchbar" style="display:none">
    <button id="queuebtn">Queue selected for summarization</button>
  </div>
</div>
<script>
const PRESETS = ["AI","Israeli politics","Cybersecurity","Startups","Economy","Science","History","Football"];
const COUNTRIES = [
  ["il","🇮🇱","Israel",597,129],["us","🇺🇸","United States",228,108],
  ["gb","🇬🇧","United Kingdom",490,64],["de","🇩🇪","Germany",529,76],
  ["fr","🇫🇷","France",505,88],["it","🇮🇹","Italy",537,100],
  ["es","🇪🇸","Spain",484,107],["nl","🇳🇱","Netherlands",511,70],
  ["se","🇸🇪","Sweden",547,49],["no","🇳🇴","Norway",527,35],
  ["dk","🇩🇰","Denmark",523,57],["pl","🇵🇱","Poland",556,72],
  ["br","🇧🇷","Brazil",356,244],["mx","🇲🇽","Mexico",215,151],
  ["ar","🇦🇷","Argentina",321,312],["ca","🇨🇦","Canada",206,58],
  ["au","🇦🇺","Australia",874,287],["jp","🇯🇵","Japan",885,115],
  ["kr","🇰🇷","South Korea",852,118],["in","🇮🇳","India",718,157],
  ["ae","🇦🇪","UAE",651,149],["za","🇿🇦","South Africa",568,297]];
const $ = id => document.getElementById(id);
const results = $('results'), status_ = $('status'), batchbar = $('batchbar');
let episodes = [];

document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));
  t.classList.add('on'); $('pane-'+t.dataset.pane).classList.add('on');
  results.innerHTML=''; status_.textContent=''; status_.className='';
  batchbar.style.display='none'; episodes=[];
});
PRESETS.forEach(t => { const c=document.createElement('span'); c.className='chip'; c.textContent=t;
  c.onclick=()=>{ $('topic').value=t; search(); }; $('chips').appendChild(c); });
const mapbox = $('mapbox');
COUNTRIES.forEach(([cc,flag,name,x,y])=>{
  const f = document.createElement('span');
  f.className='flag'; f.textContent=flag; f.title=name; f.dataset.cc=cc; f.dataset.name=name;
  f.style.left=(x/10)+'%'; f.style.top=(y/3.72)+'%';
  f.onclick=()=>topSearch(cc,name,f);
  mapbox.appendChild(f);
});

$('sf').addEventListener('submit', e=>{ e.preventDefault(); search(); });
$('mf').addEventListener('submit', e=>{ e.preventDefault(); myFeed(); });
$('lf').addEventListener('submit', async e=>{
  e.preventDefault();
  const url = $('link').value.trim(); if(!url) return;
  $('linkbtn').disabled = true; status_.className=''; status_.textContent='Queuing link…';
  try{
    const r = await fetch('/api/vidsum/queue', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({topic:'link', episodes:[{id:url, url:url, title:url}]})});
    const j = await r.json();
    if(!j.ok) throw new Error(j.error||'queue failed');
    status_.className='ok';
    status_.textContent = j.added ? '✅ Link queued — '+j.pending+' job(s) now pending.'
                                  : 'Already in the queue ('+j.pending+' pending).';
    $('link').value='';
  }catch(err){ status_.className='err'; status_.textContent='❌ '+err.message; }
  $('linkbtn').disabled = false;
});

function fmtDur(ms){ if(!ms) return ''; return Math.round(ms/60000)+' min'; }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function srcLinks(ep){
  const q = encodeURIComponent((ep.show?ep.show+' ':'')+ep.title);
  const yt = 'https://www.youtube.com/results?search_query='+q;
  const sp = 'https://open.spotify.com/search/'+q;
  return '<span class="srcs">'+
    '<a href="'+yt+'" target="_blank" rel="noopener" title="Find on YouTube" onclick="event.stopPropagation()">'+
      '<svg width="17" height="12" viewBox="0 0 28 20"><rect width="28" height="20" rx="5" fill="#FF0000"/>'+
      '<path d="M11 5.5v9l8-4.5z" fill="#fff"/></svg></a>'+
    '<a href="'+sp+'" target="_blank" rel="noopener" title="Find on Spotify" onclick="event.stopPropagation()">'+
      '<svg width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#1DB954"/>'+
      '<path d="M6.2 9.7c3.7-1.1 8.2-.8 11.4 1.1M6.8 12.8c3.1-.9 6.8-.6 9.5 1M7.4 15.7c2.5-.7 5.3-.5 7.5.8" '+
      'stroke="#000" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg></a></span>';
}

function epRow(ep, i){
  const d = document.createElement('div'); d.className='ep';
  const shownTitle = ep.title_en || ep.title;
  const orig = (ep.title_en && ep.title_en !== ep.title) ? ep.title : '';
  d.innerHTML =
    '<label class="eprow"><input type="checkbox" data-i="'+i+'"><div style="flex:1">'+
      '<div class="t">'+esc(shownTitle)+'</div>'+
      '<div class="m">'+esc(ep.show)+' · '+esc(ep.date)+' · '+fmtDur(ep.duration_ms)+srcLinks(ep)+'</div>'+
    '</div><button type="button" class="exp" title="Show details">+</button></label>'+
    '<div class="detail">'+
      (orig ? '<div class="orig">Original: '+esc(orig)+'</div>' : '')+
      esc(ep.desc || 'No description available.')+
      (ep.page ? '\n\n' : '')+
      (ep.page ? '<a href="'+esc(ep.page)+'" target="_blank" rel="noopener">Apple page ↗</a>' : '')+
    '</div>';
  const btn = d.querySelector('.exp'), det = d.querySelector('.detail');
  btn.onclick = async e => { e.preventDefault(); e.stopPropagation();
    det.classList.toggle('on'); btn.textContent = det.classList.contains('on') ? '−' : '+';
    // translate the description on first expand for non-English charts
    if (det.classList.contains('on') && ep.tr && ep.desc && !ep.desc_en && !ep._translating) {
      ep._translating = true;
      const span = document.createElement('div');
      span.className='orig'; span.textContent='Translating…';
      det.insertBefore(span, det.firstChild);
      try {
        const r = await fetch('/api/vidsum/translate', {method:'POST',
          headers:{'Content-Type':'application/json'}, body: JSON.stringify({text: ep.desc})});
        const j = await r.json();
        if (j.ok && j.text) {
          ep.desc_en = j.text;
          const link = det.querySelector('a');
          det.innerHTML = '<div class="orig">Original: '+esc(ep.title)+'</div>'+esc(ep.desc_en)+
            (link ? '\n\n'+link.outerHTML : '');
        } else { span.remove(); }
      } catch(_) { span.remove(); }
      ep._translating = false;
    }
  };
  return d;
}

function renderPodcasts(pods, headline){
  episodes = []; let shown = 0;
  pods.forEach((pod,rank)=>{
    const h = document.createElement('div'); h.className='podhead';
    const nm = pod.name_en || pod.name;
    h.innerHTML = '#'+(rank+1)+' '+esc(nm)+'<small>'+esc(pod.artist||'')+
      (pod.name_en && pod.name_en!==pod.name ? ' · '+esc(pod.name) : '')+'</small>';
    results.appendChild(h);
    if(!pod.episodes || !pod.episodes.length){
      const m=document.createElement('div'); m.className='ep';
      m.innerHTML='<div class="m">no fetchable episodes (exclusive feed)</div>';
      results.appendChild(m); return;
    }
    pod.episodes.forEach(ep=>{ const i=episodes.push(ep)-1; results.appendChild(epRow(ep,i)); shown++; });
  });
  status_.textContent = headline+' ('+shown+' entries):';
  batchbar.style.display = shown ? 'block' : 'none';
}

async function search(){
  const topic = $('topic').value.trim(); if(!topic) return;
  status_.className=''; status_.textContent='Searching the last 30 days for “'+topic+'”…';
  results.innerHTML=''; batchbar.style.display='none'; $('searchbtn').disabled=true;
  try{
    const r = await fetch('/api/vidsum/search?topic='+encodeURIComponent(topic));
    const j = await r.json();
    if(!j.ok) throw new Error(j.error||'search failed');
    episodes = j.episodes;
    if(!episodes.length){ status_.textContent='No episodes from the last 30 days for “'+topic+'”. Try another phrasing.'; return; }
    status_.textContent = episodes.length+' episodes from the last 30 days:';
    episodes.forEach((ep,i)=>results.appendChild(epRow(ep,i)));
    batchbar.style.display='block';
  }catch(e){ status_.className='err'; status_.textContent='❌ '+e.message; }
  $('searchbtn').disabled=false;
}

async function topSearch(cc, cname, flagEl){
  if(!cc) return;
  document.querySelectorAll('.flag.on').forEach(f=>f.classList.remove('on'));
  if(flagEl) flagEl.classList.add('on');
  status_.className=''; status_.textContent='Fetching the top-20 podcasts in '+cname+'…';
  results.innerHTML=''; batchbar.style.display='none';
  try{
    const r = await fetch('/api/vidsum/top?country='+cc);
    const j = await r.json();
    if(!j.ok) throw new Error(j.error||'chart failed');
    renderPodcasts(j.podcasts, 'Top-20 podcasts in '+cname+' — last 3 episodes each');
  }catch(e){ status_.className='err'; status_.textContent='❌ '+e.message; }
}

async function myFeed(){
  status_.className=''; status_.textContent='Fetching your followed podcasts…';
  results.innerHTML=''; batchbar.style.display='none'; $('minebtn').disabled=true;
  try{
    const r = await fetch('/api/vidsum/myfeed');
    const j = await r.json();
    if(!j.ok) throw new Error(j.error||'myfeed failed');
    if(!j.podcasts.length){ status_.textContent='No followed podcasts imported yet — ask Claude to import them from Spotify / Apple Podcasts.'; return; }
    renderPodcasts(j.podcasts, 'Your '+j.podcasts.length+' followed podcasts — last 3 episodes each');
  }catch(e){ status_.className='err'; status_.textContent='❌ '+e.message; }
  $('minebtn').disabled=false;
}

$('queuebtn').addEventListener('click', async ()=>{
  const sel = [...results.querySelectorAll('.eprow input:checked')].map(cb=>episodes[+cb.dataset.i]);
  if(!sel.length){ status_.className='err'; status_.textContent='Nothing selected.'; return; }
  $('queuebtn').disabled=true; status_.className=''; status_.textContent='Queuing '+sel.length+'…';
  try{
    const r = await fetch('/api/vidsum/queue', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({topic: 'discover', episodes: sel})});
    const j = await r.json();
    if(!j.ok) throw new Error(j.error||'queue failed');
    status_.className='ok';
    status_.textContent='✅ Queued '+j.added+' episode(s) — '+j.pending+' now pending. They will be summarized on the next processing run.';
    results.querySelectorAll('.eprow input:checked').forEach(cb=>cb.checked=false);
  }catch(e){ status_.className='err'; status_.textContent='❌ '+e.message; }
  $('queuebtn').disabled=false;
});
</script>
